name: Prova 1 focal — P0 RPC e capability
on:
  workflow_dispatch:
    inputs:
      confirm_single_attempt:
        description: Type PROVA1 once to admit this single focal run
        required: true
        type: string
      candidate_sha:
        description: Exact reviewed commit SHA checked out by this run
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: neroxa-proof1-focal-single-attempt
  cancel-in-progress: false
jobs:
  proof1-focal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
      AB_PROJECT: neroxa-02a3-${{ github.run_id }}-buyer
      AB_NETWORK: neroxa-02a5-${{ github.run_id }}-buyer
      MISSION_PROFILE: master
      MISSION_SOURCE_SHA: b4158a9422a0f8b4a1d059c2109fa3f9eb3acb8d
      MISSION_DELIVERY_SHA: 7ca9376f29ee205d4063e46546f5070313ab78a0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: luit77yak-dev/pizza-perfect-plate
          ref: 7ca9376f29ee205d4063e46546f5070313ab78a0
          path: delivery-candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.0'
      - name: Admit one focal run and frozen source identities
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONFIRM_SINGLE_ATTEMPT: ${{ inputs.confirm_single_attempt }}
        run: |
          set -euo pipefail
          test "$CONFIRM_SINGLE_ATTEMPT" = PROVA1
          test "$GITHUB_REF_NAME" = proof1-focal-dispatch
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          prior=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/proof1-focal.yml/runs?head_sha=$GITHUB_SHA&per_page=100" --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id")
          test -z "$prior"
          test "$(git cat-file -t b4158a9422a0f8b4a1d059c2109fa3f9eb3acb8d)" = commit
          git merge-base --is-ancestor b4158a9422a0f8b4a1d059c2109fa3f9eb3acb8d HEAD
          git diff --quiet b4158a9422a0f8b4a1d059c2109fa3f9eb3acb8d -- audits/sql tools/ab-auth tools/mission-02a3/run.mjs audits/02a2/MANIFEST-02A2.json audits/02a5/BUYER-PRE-GATE-MANIFEST.json audits/02a5/F02-AMENDMENT-EXECUTION-MANIFEST.json
          test "$(git -C delivery-candidate rev-parse HEAD)" = 7ca9376f29ee205d4063e46546f5070313ab78a0
          printf 'EXECUTOR_SHA=%s\nMASTER_SOURCE_SHA=%s\nDELIVERY_SOURCE_SHA=%s\n' "$GITHUB_SHA" "$MISSION_SOURCE_SHA" "$MISSION_DELIVERY_SHA"
      - name: Public standard eligibility and real capacity before pull
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY --jq .private)" = false
          test "$RUNNER_ENVIRONMENT" = github-hosted
          echo 'PUBLIC_STANDARD_RUNNER=true; billing basis docs.github.com/en/billing/concepts/product-billing/github-actions; no larger runner/cache/artifact uploads'
          python3 tools/mission-02a3/preflight.py
      - name: Locked app dependencies and pinned CLI; no commercial dotenv
        run: |
          find . -name '.env*' -not -path './.git/*' -not -path './node_modules/*' -type f -delete
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/cli" --no-audit --no-fund supabase@2.120.0
          echo "$RUNNER_TEMP/cli/node_modules/.bin" >> "$GITHUB_PATH"
          python3 audits/02a5/verify_manifest.py
          python3 audits/proof1-focal/generate.py
      - name: Unlinked native six-service stack, loopback binds
        run: |
          export AB_WORKDIR="$RUNNER_TEMP/02a5-buyer-$GITHUB_RUN_ID"
          echo "AB_WORKDIR=$AB_WORKDIR" >> "$GITHUB_ENV"
          mkdir -m 700 "$AB_WORKDIR"
          supabase init --workdir "$AB_WORKDIR"
          python3 tools/ab-auth/configure.py
          test ! -f "$AB_WORKDIR/supabase/.temp/project-ref"
          test ! -d "$AB_WORKDIR/supabase/migrations"
          docker network create --driver bridge --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 "$AB_NETWORK"
          python3 tools/ab-auth/docker_loopback.py > "$AB_WORKDIR/relay.private.log" 2>&1 &
          echo $! > "$AB_WORKDIR/relay.pid"
          for attempt in $(seq 1 30); do test -S "$AB_WORKDIR/docker-loopback.sock" && break; sleep 1; done
          export DOCKER_HOST="unix://$AB_WORKDIR/docker-loopback.sock"
          echo "DOCKER_HOST=$DOCKER_HOST" >> "$GITHUB_ENV"
          # The upstream PostgreSQL tag was republished. Reuse the ORIGINAL image,
          # not a newly admitted image: immutable manifest -> unchanged frozen config ID.
          pg='supabase/postgres@sha256:f2a84af37797675f0b27e27ea1fad2ebcd913ebf7ad60be05d7df0bcbd29e4b5'
          docker --host=unix:///var/run/docker.sock pull --platform linux/amd64 "$pg"
          test "$(docker --host=unix:///var/run/docker.sock image inspect "$pg" --format '{{.Id}}')" = "$(python3 -c 'import json; print(json.load(open("audits/02a5/EXPECTED-IMAGES.json"))["supabase/postgres:17.11.0.004"])')"
          docker --host=unix:///var/run/docker.sock tag "$pg" supabase/postgres:17.11.0.004
          if ! supabase start --workdir "$AB_WORKDIR" --network-id "$AB_NETWORK" --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit > "$AB_WORKDIR/start.private.log" 2>&1; then
            python3 tools/ab-auth/start_failure.py
            exit 1
          fi
          supabase status --workdir "$AB_WORKDIR" -o env > "$AB_WORKDIR/status.private.env"
          chmod 600 "$AB_WORKDIR/status.private.env"
          python3 - <<'PY'
          import json,subprocess,os
          expected=json.load(open('audits/02a5/EXPECTED-IMAGES.json'));seen={}
          for line in subprocess.check_output(['docker','ps','--format','{{json .}}'],text=True).splitlines():
            c=json.loads(line)
            if c['Names'].endswith('_'+os.environ['AB_PROJECT']):seen[c['Image']]=subprocess.check_output(['docker','inspect',c['Names'],'--format','{{.Image}}'],text=True).strip()
          print('IMAGE_IDENTITY_COMPARISON='+json.dumps({'expected':expected,'observed':seen},sort_keys=True))
          assert seen==expected, 'BLOCKED: image identity drift'
          print('IMAGE_IDENTITIES='+json.dumps(seen))
          PY
      - name: Real Auth and buyer recut with test UID egress restriction
        run: |
          set -euo pipefail
          sudo useradd --create-home --groups docker neroxa_test
          sudo chown -R neroxa_test:neroxa_test "$AB_WORKDIR"
          # Dedicated UID needs traversal/read of the audited workspace, not runner secrets.
          ancestor="$GITHUB_WORKSPACE"
          while [ "$ancestor" != / ]; do
            sudo setfacl -m u:neroxa_test:--x "$ancestor"
            ancestor=$(dirname "$ancestor")
          done
          sudo setfacl -R -m u:neroxa_test:rX "$GITHUB_WORKSPACE"
          sudo -u neroxa_test test -r tools/mission-02a3/proof1-focal-generated.private.mjs
          echo 'TEST_UID_WORKSPACE_READ=PASS'
          bash tools/mission-02a5/network.sh lock
          trap 'bash tools/mission-02a5/network.sh unlock' EXIT
          sudo -u neroxa_test env -i PATH="$PATH" HOME=/home/neroxa_test AB_WORKDIR="$AB_WORKDIR" AB_PROJECT="$AB_PROJECT" MISSION_PROFILE=master AB_NETWORK="$AB_NETWORK" MISSION_REVOKE_SCOPE=THIS_RUN_LOCAL_CLONE_ONLY GITHUB_ACTIONS_SCOPE=disposable-workflow MISSION_SOURCE_SHA=b4158a9422a0f8b4a1d059c2109fa3f9eb3acb8d MISSION_RUN_ID="$GITHUB_RUN_ID" MISSION_DELIVERY_SHA=7ca9376f29ee205d4063e46546f5070313ab78a0 DOCKER_HOST=unix:///var/run/docker.sock node --experimental-strip-types tools/mission-02a3/proof1-focal-generated.private.mjs | tee "$RUNNER_TEMP/proof1-focal.log"
      - name: Require three focal assertions
        if: always()
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/proof1-focal.log"
          result=$(grep 'PROVA1_FOCAL_RESULT=' "$RUNNER_TEMP/proof1-focal.log" | tail -n 1 | sed 's/^.*PROVA1_FOCAL_RESULT=//')
          python3 -c 'import json,sys; r=json.loads(sys.argv[1]); assert r["status"]=="PASS PROVA1_FOCAL"; c={x["id"]:x["status"] for x in r["proof1"]["checks"]}; assert c=={"negative-read":"PASS","negative-write":"PASS","positive-capability":"PASS"}' "$result"
      - name: Cleanup only this disposable project
        if: always()
        run: |
          set -uo pipefail
          cleanup_failed=0
          bash tools/mission-02a5/network.sh unlock || { echo 'CLEANUP_ERROR=network unlock'; cleanup_failed=1; }
          if [ -n "${AB_WORKDIR:-}" ] && sudo test -d "$AB_WORKDIR"; then
            sudo chown -R "$(id -u):$(id -g)" "$AB_WORKDIR" || { echo 'CLEANUP_ERROR=workdir ownership'; cleanup_failed=1; }
          fi
          export DOCKER_HOST=unix:///var/run/docker.sock
          if [ -n "${AB_WORKDIR:-}" ] && [ -f "$AB_WORKDIR/supabase/config.toml" ]; then
            supabase stop --workdir "$AB_WORKDIR" --no-backup || { echo 'CLEANUP_ERROR=supabase stop'; cleanup_failed=1; }
          fi
          if [ -n "${AB_WORKDIR:-}" ] && [ -f "$AB_WORKDIR/relay.pid" ]; then
            relay_pid=$(cat "$AB_WORKDIR/relay.pid")
            kill "$relay_pid" 2>/dev/null || true
            for _ in $(seq 1 10); do kill -0 "$relay_pid" 2>/dev/null || break; sleep 1; done
            if kill -0 "$relay_pid" 2>/dev/null; then echo 'CLEANUP_ERROR=relay reap'; cleanup_failed=1; fi
          fi
          if docker network inspect "$AB_NETWORK" >/dev/null 2>&1; then docker network rm "$AB_NETWORK" || { echo 'CLEANUP_ERROR=network removal'; cleanup_failed=1; }; fi
          remaining=$(docker ps -aq --filter label=com.supabase.cli.project=$AB_PROJECT 2>/dev/null) || { echo 'CLEANUP_ERROR=container inventory'; cleanup_failed=1; remaining=unknown; }
          if [ "$remaining" != unknown ] && [ -n "$remaining" ]; then echo 'CLEANUP_ERROR=containers remain'; cleanup_failed=1; fi
          if [ -n "${AB_WORKDIR:-}" ] && [ -e "$AB_WORKDIR" ]; then rm -rf -- "$AB_WORKDIR" || { echo 'CLEANUP_ERROR=workdir removal'; cleanup_failed=1; }; fi
          if [ -n "${AB_WORKDIR:-}" ] && [ -e "$AB_WORKDIR" ]; then echo 'CLEANUP_ERROR=workdir remains'; cleanup_failed=1; fi
          rm -f "$RUNNER_TEMP/proof1-focal.log" || { echo 'CLEANUP_ERROR=focal log removal'; cleanup_failed=1; }
          test "$cleanup_failed" -eq 0
          echo 'CLEANUP=PASS; focal services, relay, network and private workdir absent'
