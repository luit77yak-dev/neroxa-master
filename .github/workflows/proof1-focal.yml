name: Prova 1 focal — P0 RPC e capability
on:
  workflow_dispatch:
    inputs:
      confirm_single_attempt:
        description: Type PROVA1_T02 for the separately authorized second diagnostic attempt
        required: true
        type: string
      candidate_sha:
        description: Exact reviewed commit SHA checked out by this run
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: neroxa-proof1-focal-single-attempt
  cancel-in-progress: false
jobs:
  proof1-focal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
      AB_PROJECT: neroxa-02a3-${{ github.run_id }}-buyer
      AB_NETWORK: neroxa-02a5-${{ github.run_id }}-buyer
      MISSION_PROFILE: master
      MISSION_SOURCE_SHA: b4158a9422a0f8b4a1d059c2109fa3f9eb3acb8d
      MISSION_DELIVERY_SHA: 7ca9376f29ee205d4063e46546f5070313ab78a0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: luit77yak-dev/pizza-perfect-plate
          ref: 7ca9376f29ee205d4063e46546f5070313ab78a0
          path: delivery-candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.0'
      - name: Admit one focal run and frozen source identities
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONFIRM_SINGLE_ATTEMPT: ${{ inputs.confirm_single_attempt }}
        run: |
          set -euo pipefail
          test "$CONFIRM_SINGLE_ATTEMPT" = PROVA1_T02
          test "$GITHUB_REPOSITORY" = luit77yak-dev/neroxa-master
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/proof1-focal-attempt02-20261101
          test "$GITHUB_RUN_NUMBER" = 2
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$CANDIDATE_SHA" != 9dc3913fb8a7e4e96b668c5b5c0c7c696a2f4b97
          test "$CANDIDATE_SHA" != 2635237c8f457fc3a378cf7322c3e5eaaf58fd93
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/proof1-focal.yml/runs?per_page=100" > "$RUNNER_TEMP/proof1-history.json"
          python3 - <<'PYHISTORY'
          import json,os,re
          pages=json.load(open(os.environ['RUNNER_TEMP']+'/proof1-history.json'))
          assert isinstance(pages,list) and pages
          expected_total=pages[0].get('total_count')
          assert type(expected_total) is int and expected_total>=0, 'Missing/invalid total_count; STOP'
          runs=[]
          for page in pages:
            assert type(page.get('total_count')) is int and page['total_count']==expected_total, 'Divergent page counts; STOP'
            assert isinstance(page.get('workflow_runs'),list)
            runs.extend(page['workflow_runs'])
          assert len(runs)==expected_total, 'Incomplete history; STOP'
          for item in runs:
            assert isinstance(item,dict)
            assert all(type(item.get(k)) is int and item[k]>0 for k in ['id','workflow_id','run_number','run_attempt'])
            assert item['workflow_id']==403793720 and item.get('path')=='.github/workflows/proof1-focal.yml'
            assert item.get('event')=='workflow_dispatch' and isinstance(item.get('head_branch'),str)
            assert re.fullmatch('[0-9a-f]{40}',item.get('head_sha',''))
          assert len({r['run_number'] for r in runs})==len(runs), 'Duplicate run number; STOP'
          assert len({r['id'] for r in runs})==len(runs), 'Ambiguous history; STOP'
          current=[r for r in runs if r['id']==int(os.environ['GITHUB_RUN_ID'])]
          assert len(current)==1
          r=current[0]
          assert r['workflow_id']==403793720 and r['run_number']==2 and r['run_attempt']==1
          assert r['event']=='workflow_dispatch' and r['head_branch']=='proof1-focal-attempt02-20261101'
          assert r['head_sha']==os.environ['CANDIDATE_SHA']
          previous=[r for r in runs if r['run_number']<2]
          assert len(previous)==1
          p=previous[0]
          assert p['id']==41339698296 and p['workflow_id']==403793720 and p['run_number']==1 and p['run_attempt']==1
          assert p['head_branch']=='proof1-focal-dispatch' and p['event']=='workflow_dispatch'
          assert p['head_sha']=='9dc3913fb8a7e4e96b668c5b5c0c7c696a2f4b97' and p['conclusion']=='failure'
          assert not any(x['id']!=r['id'] and (x['run_number']==2 or x['head_sha']==r['head_sha']) for x in runs)
          PYHISTORY
          test "$(git cat-file -t b4158a9422a0f8b4a1d059c2109fa3f9eb3acb8d)" = commit
          git merge-base --is-ancestor b4158a9422a0f8b4a1d059c2109fa3f9eb3acb8d HEAD
          git merge-base --is-ancestor 2635237c8f457fc3a378cf7322c3e5eaaf58fd93 HEAD
          git diff --quiet 9dc3913fb8a7e4e96b668c5b5c0c7c696a2f4b97 -- audits/02a5/EXPECTED-IMAGES.json audits/02a5/INTEGRATED-MANIFEST.json audits/02a5/verify_manifest.py tools/mission-02a3/preflight.py audits/proof1-focal/driver.mjs audits/proof1-focal/generate.py tools/mission-02a5/network.sh
          git diff --quiet b4158a9422a0f8b4a1d059c2109fa3f9eb3acb8d -- audits/sql tools/ab-auth tools/mission-02a3/run.mjs audits/02a2/MANIFEST-02A2.json audits/02a5/BUYER-PRE-GATE-MANIFEST.json audits/02a5/F02-AMENDMENT-EXECUTION-MANIFEST.json
          test "$(git -C delivery-candidate rev-parse HEAD)" = 7ca9376f29ee205d4063e46546f5070313ab78a0
          printf 'EXECUTOR_SHA=%s\nMASTER_SOURCE_SHA=%s\nDELIVERY_SOURCE_SHA=%s\n' "$GITHUB_SHA" "$MISSION_SOURCE_SHA" "$MISSION_DELIVERY_SHA"
      - name: Public standard eligibility and real capacity before pull
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY --jq .private)" = false
          test "$RUNNER_ENVIRONMENT" = github-hosted
          echo 'PUBLIC_STANDARD_RUNNER=true; billing basis docs.github.com/en/billing/concepts/product-billing/github-actions; no larger runner/cache/artifact uploads'
          python3 tools/mission-02a3/preflight.py
      - name: Locked app dependencies and pinned CLI; no commercial dotenv
        run: |
          set -euo pipefail
          find . -name '.env*' -not -path './.git/*' -not -path './node_modules/*' -type f -delete
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/cli" --no-audit --no-fund supabase@2.120.0
          echo "$RUNNER_TEMP/cli/node_modules/.bin" >> "$GITHUB_PATH"
          python3 audits/02a5/verify_manifest.py
          python3 audits/proof1-focal/generate.py
      - name: Unlinked native six-service stack, loopback binds
        id: lab
        run: |
          set -euo pipefail
          export AB_WORKDIR="$RUNNER_TEMP/02a5-buyer-$GITHUB_RUN_ID"
          echo "AB_WORKDIR=$AB_WORKDIR" >> "$GITHUB_ENV"
          mkdir -m 700 "$AB_WORKDIR"
          supabase init --workdir "$AB_WORKDIR"
          python3 tools/ab-auth/configure.py
          test ! -f "$AB_WORKDIR/supabase/.temp/project-ref"
          test ! -d "$AB_WORKDIR/supabase/migrations"
          docker network create --driver bridge --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 "$AB_NETWORK"
          python3 tools/ab-auth/docker_loopback.py > "$AB_WORKDIR/relay.private.log" 2>&1 &
          echo $! > "$AB_WORKDIR/relay.pid"
          for attempt in $(seq 1 30); do test -S "$AB_WORKDIR/docker-loopback.sock" && break; sleep 1; done
          export DOCKER_HOST="unix://$AB_WORKDIR/docker-loopback.sock"
          echo "DOCKER_HOST=$DOCKER_HOST" >> "$GITHUB_ENV"
          # The upstream PostgreSQL tag was republished. Reuse the ORIGINAL image,
          # not a newly admitted image: immutable manifest -> unchanged frozen config ID.
          pg='supabase/postgres@sha256:f2a84af37797675f0b27e27ea1fad2ebcd913ebf7ad60be05d7df0bcbd29e4b5'
          docker --host=unix:///var/run/docker.sock pull --platform linux/amd64 "$pg"
          observed_id="$(docker --host=unix:///var/run/docker.sock image inspect "$pg" --format '{{.Id}}')"
          expected_id="$(python3 -c 'import json; print(json.load(open("audits/02a5/EXPECTED-IMAGES.json"))["supabase/postgres:17.11.0.004"])')"
          printf 'POSTGRES_IMAGE_ID_OBSERVED=%s\n' "$observed_id"
          printf 'POSTGRES_IMAGE_ID_EXPECTED=%s\n' "$expected_id"
          test -n "$observed_id"
          test -n "$expected_id"
          test "$observed_id" = "$expected_id"
          docker --host=unix:///var/run/docker.sock tag "$pg" supabase/postgres:17.11.0.004
          if ! supabase start --workdir "$AB_WORKDIR" --network-id "$AB_NETWORK" --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit > "$AB_WORKDIR/start.private.log" 2>&1; then
            python3 tools/ab-auth/start_failure.py
            exit 1
          fi
          supabase status --workdir "$AB_WORKDIR" -o env > "$AB_WORKDIR/status.private.env"
          chmod 600 "$AB_WORKDIR/status.private.env"
          python3 - <<'PY'
          import json,subprocess,os
          expected=json.load(open('audits/02a5/EXPECTED-IMAGES.json'));seen={}
          for line in subprocess.check_output(['docker','ps','--format','{{json .}}'],text=True).splitlines():
            c=json.loads(line)
            if c['Names'].endswith('_'+os.environ['AB_PROJECT']):seen[c['Image']]=subprocess.check_output(['docker','inspect',c['Names'],'--format','{{.Image}}'],text=True).strip()
          print('IMAGE_IDENTITY_COMPARISON='+json.dumps({'expected':expected,'observed':seen},sort_keys=True))
          assert seen==expected, 'BLOCKED: image identity drift'
          print('IMAGE_IDENTITIES='+json.dumps(seen))
          PY
      - name: Real Auth and buyer recut with test UID egress restriction
        run: |
          set -euo pipefail
          sudo useradd --create-home --groups docker neroxa_test
          sudo chown -R neroxa_test:neroxa_test "$AB_WORKDIR"
          # Dedicated UID needs traversal/read of the audited workspace, not runner secrets.
          ancestor="$GITHUB_WORKSPACE"
          while [ "$ancestor" != / ]; do
            sudo setfacl -m u:neroxa_test:--x "$ancestor"
            ancestor=$(dirname "$ancestor")
          done
          sudo setfacl -R -m u:neroxa_test:rX "$GITHUB_WORKSPACE"
          sudo -u neroxa_test test -r tools/mission-02a3/proof1-focal-generated.private.mjs
          echo 'TEST_UID_WORKSPACE_READ=PASS'
          bash tools/mission-02a5/network.sh lock
          trap 'rc=$?; bash tools/mission-02a5/network.sh unlock || rc=1; exit "$rc"' EXIT
          sudo -u neroxa_test env -i PATH="$PATH" HOME=/home/neroxa_test AB_WORKDIR="$AB_WORKDIR" AB_PROJECT="$AB_PROJECT" MISSION_PROFILE=master AB_NETWORK="$AB_NETWORK" MISSION_REVOKE_SCOPE=THIS_RUN_LOCAL_CLONE_ONLY GITHUB_ACTIONS_SCOPE=disposable-workflow MISSION_SOURCE_SHA=b4158a9422a0f8b4a1d059c2109fa3f9eb3acb8d MISSION_RUN_ID="$GITHUB_RUN_ID" MISSION_DELIVERY_SHA=7ca9376f29ee205d4063e46546f5070313ab78a0 DOCKER_HOST=unix:///var/run/docker.sock node --experimental-strip-types tools/mission-02a3/proof1-focal-generated.private.mjs | tee "$RUNNER_TEMP/proof1-focal.log"
      - name: Require three focal assertions
        if: always()
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/proof1-focal.log"
          result=$(grep 'PROVA1_FOCAL_RESULT=' "$RUNNER_TEMP/proof1-focal.log" | tail -n 1 | sed 's/^.*PROVA1_FOCAL_RESULT=//')
          test "$(grep -c '^PROVA1_FOCAL_RESULT=' "$RUNNER_TEMP/proof1-focal.log")" = 1
          python3 -c 'import json,sys; r=json.loads(sys.argv[1]); assert r["status"]=="PASS PROVA1_FOCAL"; checks=r["proof1"]["checks"]; assert len(checks)==3; c={x["id"]:x["status"] for x in checks}; assert c=={"negative-read":"PASS","negative-write":"PASS","positive-capability":"PASS"}' "$result"
      - name: Cleanup only this disposable project
        if: ${{ always() && steps.lab.outcome != 'skipped' }}
        env:
          LAB_OUTCOME: ${{ steps.lab.outcome }}
        run: |
          set +e
          set -uo pipefail
          cleanup_failed=0
          cleanup_unknown=0
          case "${LAB_OUTCOME:-}" in success|failure|cancelled) ;; *) echo 'CLEANUP_UNCERTAIN=lab outcome unavailable'; cleanup_unknown=1 ;; esac
          expected_workdir="$RUNNER_TEMP/02a5-buyer-$GITHUB_RUN_ID"
          if [ -z "${AB_WORKDIR:-}" ]; then AB_WORKDIR="$expected_workdir"; cleanup_unknown=1; fi
          if [ "$AB_WORKDIR" != "$expected_workdir" ]; then echo 'CLEANUP_ERROR=workdir scope mismatch'; AB_WORKDIR=''; cleanup_failed=1; cleanup_unknown=1; fi
          network_id=$(docker --host=unix:///var/run/docker.sock network inspect "$AB_NETWORK" --format '{{.Id}}' 2>/dev/null || true)
          project_bridge=''
          if [ -n "$network_id" ]; then project_bridge="br-${network_id:0:12}"; fi
          bash tools/mission-02a5/network.sh unlock || { echo 'CLEANUP_ERROR=network unlock'; cleanup_failed=1; }
          for save in iptables-save ip6tables-save; do
            if rules=$(sudo "$save"); then
              if grep -q NEROXA02A5 <<< "$rules"; then echo 'CLEANUP_ERROR=UID firewall remains'; cleanup_failed=1; fi
              if [ -n "$project_bridge" ] && grep -Fq -- "-i $project_bridge " <<< "$rules"; then echo 'CLEANUP_ERROR=project bridge firewall remains'; cleanup_failed=1; fi
            else echo 'CLEANUP_ERROR=firewall inventory'; cleanup_failed=1; cleanup_unknown=1; fi
          done
          if [ -n "${AB_WORKDIR:-}" ] && sudo test -d "$AB_WORKDIR"; then
            sudo chown -R "$(id -u):$(id -g)" "$AB_WORKDIR" || { echo 'CLEANUP_ERROR=workdir ownership'; cleanup_failed=1; }
          fi
          export DOCKER_HOST=unix:///var/run/docker.sock
          if [ -n "${AB_WORKDIR:-}" ] && [ -f "$AB_WORKDIR/supabase/config.toml" ]; then
            supabase stop --workdir "$AB_WORKDIR" --no-backup || { echo 'CLEANUP_ERROR=supabase stop'; cleanup_failed=1; }
          fi
          if [ -n "${AB_WORKDIR:-}" ] && [ -f "$AB_WORKDIR/relay.private.log" ]; then
            if [ ! -f "$AB_WORKDIR/relay.pid" ] || [ -z "$network_id" ]; then echo 'CLEANUP_UNCERTAIN=relay or bridge identity unavailable'; cleanup_unknown=1; fi
          fi
          if [ -n "${AB_WORKDIR:-}" ] && [ -f "$AB_WORKDIR/relay.pid" ]; then
            relay_pid=$(cat "$AB_WORKDIR/relay.pid") || { echo 'CLEANUP_ERROR=relay PID read'; cleanup_failed=1; cleanup_unknown=1; relay_pid=''; }
            if [[ "$relay_pid" =~ ^[0-9]+$ ]] && [ "$relay_pid" -gt 1 ]; then
              kill "$relay_pid" 2>/dev/null || true
              for _ in $(seq 1 10); do kill -0 "$relay_pid" 2>/dev/null || break; sleep 1; done
              if kill -0 "$relay_pid" 2>/dev/null; then echo 'CLEANUP_ERROR=relay reap'; cleanup_failed=1; fi
            else echo 'CLEANUP_ERROR=invalid relay PID'; cleanup_failed=1; cleanup_unknown=1; fi
          fi
          if docker network inspect "$AB_NETWORK" >/dev/null 2>&1; then docker network rm "$AB_NETWORK" || { echo 'CLEANUP_ERROR=network removal'; cleanup_failed=1; }; fi
          networks=$(docker network ls --filter name="^${AB_NETWORK}$" --format '{{.Name}}') || { echo 'CLEANUP_ERROR=network inventory'; cleanup_failed=1; cleanup_unknown=1; networks=unknown; }
          if [ -n "$networks" ]; then echo 'CLEANUP_ERROR=network absent not confirmed'; cleanup_failed=1; fi
          remaining=$(docker ps -aq --filter label=com.supabase.cli.project=$AB_PROJECT 2>/dev/null) || { echo 'CLEANUP_ERROR=container inventory'; cleanup_failed=1; cleanup_unknown=1; remaining=unknown; }
          if [ "$remaining" != unknown ] && [ -n "$remaining" ]; then echo 'CLEANUP_ERROR=containers remain'; cleanup_failed=1; fi
          if [ -n "${AB_WORKDIR:-}" ] && [ -e "$AB_WORKDIR" ]; then rm -rf -- "$AB_WORKDIR" || { echo 'CLEANUP_ERROR=workdir removal'; cleanup_failed=1; }; fi
          if [ -n "${AB_WORKDIR:-}" ] && [ -e "$AB_WORKDIR" ]; then echo 'CLEANUP_ERROR=workdir remains'; cleanup_failed=1; fi
          rm -f "$RUNNER_TEMP/proof1-focal.log" || { echo 'CLEANUP_ERROR=focal log removal'; cleanup_failed=1; }
          if [ "$cleanup_unknown" -ne 0 ]; then echo 'CLEANUP=UNKNOWN'; exit 1; fi
          if [ "$cleanup_failed" -ne 0 ]; then echo 'CLEANUP=FAIL'; exit 1; fi
          echo 'CLEANUP=PASS; focal services, relay, network and private workdir absent'
