name: Prova 1 focal — P0 RPC e capability
on:
  workflow_dispatch:
    inputs:
      confirm_single_attempt:
        description: Type PROVA1_ONE_SHOT only after separate authorization for this exact candidate SHA
        required: true
        type: string
      candidate_sha:
        description: Exact reviewed commit SHA checked out by this run
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: neroxa-proof1-focal-single-attempt
  cancel-in-progress: false
jobs:
  proof1-focal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
      AB_PROJECT: neroxa-02a3-${{ github.run_id }}-buyer
      AB_NETWORK: neroxa-02a5-${{ github.run_id }}-buyer
      MISSION_PROFILE: master
      MISSION_SOURCE_SHA: b4158a9422a0f8b4a1d059c2109fa3f9eb3acb8d
      MISSION_DELIVERY_SHA: 7ca9376f29ee205d4063e46546f5070313ab78a0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: luit77yak-dev/pizza-perfect-plate
          ref: 7ca9376f29ee205d4063e46546f5070313ab78a0
          path: delivery-candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.0'
      - name: Admit one focal run and frozen source identities
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONFIRM_SINGLE_ATTEMPT: ${{ inputs.confirm_single_attempt }}
        run: |
          set -euo pipefail
          test "$CONFIRM_SINGLE_ATTEMPT" = PROVA1_ONE_SHOT
          test "$GITHUB_REPOSITORY" = luit77yak-dev/neroxa-master
          test "$GITHUB_ACTOR" = luit77yak-dev
          test "$GITHUB_ACTOR_ID" = 333551887
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/proof1-focal-attempt02-20261101
          test "$GITHUB_RUN_NUMBER" = 3
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = c4571fbe69385169ce3494457c413a03246a28d3
          changed_files=$(git diff-tree --no-commit-id --name-only -r HEAD)
          test "$changed_files" = .github/workflows/proof1-focal.yml
          branch_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/$GITHUB_REF_NAME" --jq .commit.sha)
          test "$branch_sha" = "$CANDIDATE_SHA"
          test "$CANDIDATE_SHA" != 9dc3913fb8a7e4e96b668c5b5c0c7c696a2f4b97
          test "$CANDIDATE_SHA" != 2635237c8f457fc3a378cf7322c3e5eaaf58fd93
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/proof1-focal.yml/runs?per_page=100" > "$RUNNER_TEMP/proof1-history.json"
          python3 - <<'PYHISTORY'
          import json,os,re
          pages=json.load(open(os.environ['RUNNER_TEMP']+'/proof1-history.json'))
          assert isinstance(pages,list) and pages, 'Missing history pages; STOP'
          expected_total=pages[0].get('total_count')
          assert type(expected_total) is int and expected_total==3, 'Expected exactly historical runs 1/2 plus this one-shot run 3; STOP'
          runs=[]
          for page in pages:
            assert type(page.get('total_count')) is int and page['total_count']==expected_total, 'Divergent page counts; STOP'
            assert isinstance(page.get('workflow_runs'),list)
            runs.extend(page['workflow_runs'])
          assert len(runs)==expected_total, 'Incomplete history; STOP'
          for item in runs:
            assert isinstance(item,dict)
            assert all(type(item.get(k)) is int and item[k]>0 for k in ['id','workflow_id','run_number','run_attempt'])
            assert item['workflow_id']==403793720 and item.get('path')=='.github/workflows/proof1-focal.yml'
            assert item.get('event')=='workflow_dispatch' and isinstance(item.get('head_branch'),str)
            assert re.fullmatch('[0-9a-f]{40}',item.get('head_sha',''))
            actor=item.get('actor') or {}
            assert actor.get('login')=='luit77yak-dev' and actor.get('id')==333551887, 'Unexpected dispatch account; STOP'
          assert {r['run_number'] for r in runs}=={1,2,3}, 'Missing, duplicate, or additional run number; STOP'
          assert len({r['id'] for r in runs})==3, 'Ambiguous history; STOP'
          by_number={r['run_number']:r for r in runs}
          first,second,current=(by_number[n] for n in (1,2,3))
          assert first['id']==41339698296 and first['run_attempt']==1
          assert first['head_branch']=='proof1-focal-dispatch' and first['head_sha']=='9dc3913fb8a7e4e96b668c5b5c0c7c696a2f4b97'
          assert first['event']=='workflow_dispatch' and first['status']=='completed' and first['conclusion']=='failure'
          assert second['id']==41359945472 and second['run_attempt']==1
          assert second['head_branch']=='proof1-focal-attempt02-20261101' and second['head_sha']=='9067264f5f4213ed44820e42066a6c25d7c313c3'
          assert second['event']=='workflow_dispatch' and second['status']=='completed' and second['conclusion']=='failure'
          assert current['id']==int(os.environ['GITHUB_RUN_ID'])
          assert current['workflow_id']==403793720 and current['run_number']==3 and current['run_attempt']==1
          assert current['event']=='workflow_dispatch' and current['head_branch']=='proof1-focal-attempt02-20261101'
          assert current['head_sha']==os.environ['CANDIDATE_SHA']
          assert current['status']=='in_progress' and current.get('conclusion') is None
          assert all(x['status']=='completed' for x in (first,second)), 'Historical run still active; STOP'
          assert not any(x is not current and x['head_sha']==current['head_sha'] for x in runs), 'Candidate SHA already consumed; STOP'
          assert sum(x['status']!='completed' for x in runs)==1, 'Concurrent focal execution; STOP'
          PYHISTORY
          test "$(git cat-file -t b4158a9422a0f8b4a1d059c2109fa3f9eb3acb8d)" = commit
          git merge-base --is-ancestor b4158a9422a0f8b4a1d059c2109fa3f9eb3acb8d HEAD
          git merge-base --is-ancestor 2635237c8f457fc3a378cf7322c3e5eaaf58fd93 HEAD
          git diff --quiet 9dc3913fb8a7e4e96b668c5b5c0c7c696a2f4b97 -- audits/02a5/EXPECTED-IMAGES.json audits/02a5/INTEGRATED-MANIFEST.json audits/02a5/verify_manifest.py tools/mission-02a3/preflight.py audits/proof1-focal/driver.mjs audits/proof1-focal/generate.py tools/mission-02a5/network.sh
          git diff --quiet b4158a9422a0f8b4a1d059c2109fa3f9eb3acb8d -- audits/sql tools/ab-auth tools/mission-02a3/run.mjs audits/02a2/MANIFEST-02A2.json audits/02a5/BUYER-PRE-GATE-MANIFEST.json audits/02a5/F02-AMENDMENT-EXECUTION-MANIFEST.json
          test "$(git -C delivery-candidate rev-parse HEAD)" = 7ca9376f29ee205d4063e46546f5070313ab78a0
          printf 'EXECUTOR_SHA=%s\nMASTER_SOURCE_SHA=%s\nDELIVERY_SOURCE_SHA=%s\n' "$GITHUB_SHA" "$MISSION_SOURCE_SHA" "$MISSION_DELIVERY_SHA"
      - name: Public standard eligibility and real capacity before pull
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY --jq .private)" = false
          test "$RUNNER_ENVIRONMENT" = github-hosted
          echo 'PUBLIC_STANDARD_RUNNER=true; billing basis docs.github.com/en/billing/concepts/product-billing/github-actions; no larger runner/cache/artifact uploads'
          python3 tools/mission-02a3/preflight.py
      - name: Locked app dependencies and pinned CLI; no commercial dotenv
        run: |
          set -euo pipefail
          find . -name '.env*' -not -path './.git/*' -not -path './node_modules/*' -type f -delete
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/cli" --no-audit --no-fund supabase@2.120.0
          echo "$RUNNER_TEMP/cli/node_modules/.bin" >> "$GITHUB_PATH"
          python3 audits/02a5/verify_manifest.py
          python3 audits/proof1-focal/generate.py
      - name: Prepare isolated test identity and deny Docker socket access
        run: |
          set -euo pipefail
          if id neroxa_test >/dev/null 2>&1; then echo 'BLOCKED=test UID already exists'; exit 1; fi
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin neroxa_test
          id -u neroxa_test > "$RUNNER_TEMP/proof1-test-uid.receipt"
          chmod 600 "$RUNNER_TEMP/proof1-test-uid.receipt"
          if id -nG neroxa_test | tr ' ' '\n' | grep -qx docker; then echo 'BLOCKED=test UID belongs to docker group'; exit 1; fi
          sudo -u neroxa_test python3 - <<'PY'
          import errno,os,socket,stat
          path='/var/run/docker.sock'
          try: info=os.lstat(path)
          except FileNotFoundError: print('DOCKER_SOCKET_BOUNDARY=absent'); raise SystemExit(0)
          if not stat.S_ISSOCK(info.st_mode): raise SystemExit('BLOCKED: Docker socket path is not a socket')
          s=socket.socket(socket.AF_UNIX)
          try: s.connect(path)
          except OSError as e:
            if e.errno in (errno.EACCES,errno.EPERM): print('DOCKER_SOCKET_BOUNDARY=denied')
            else: raise SystemExit('BLOCKED: Docker socket denial was inconclusive: '+str(e.errno))
          else: raise SystemExit('BLOCKED: focal UID can connect to Docker socket')
          finally: s.close()
          PY
      - name: Start disposable services through prep-only loopback relay
        id: lab
        run: |
          set -euo pipefail
          export AB_WORKDIR="$RUNNER_TEMP/02a5-buyer-$GITHUB_RUN_ID"
          echo "AB_WORKDIR=$AB_WORKDIR" >> "$GITHUB_ENV"
          mkdir -m 700 "$AB_WORKDIR"
          supabase init --workdir "$AB_WORKDIR"
          python3 tools/ab-auth/configure.py
          test ! -f "$AB_WORKDIR/supabase/.temp/project-ref"
          test ! -d "$AB_WORKDIR/supabase/migrations"
          python3 -c 'import os,signal; assert callable(getattr(os,"pidfd_open",None)) and callable(getattr(signal,"pidfd_send_signal",None)), "BLOCKED: pidfd cleanup support unavailable"'
          : > "$AB_WORKDIR/network.started"
          chmod 600 "$AB_WORKDIR/network.started"
          network_id=$(docker --host=unix:///var/run/docker.sock network create --driver bridge --ipv6=false --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 "$AB_NETWORK")
          test "$(docker --host=unix:///var/run/docker.sock network inspect "$AB_NETWORK" --format '{{.EnableIPv6}}')" = false
          printf '%s\n%s\n' "$AB_NETWORK" "$network_id" > "$AB_WORKDIR/network.receipt"
          chmod 600 "$AB_WORKDIR/network.receipt"
          relay_started="$RUNNER_TEMP/proof1-relay-$GITHUB_RUN_ID.started"
          relay_identity="$RUNNER_TEMP/proof1-relay-$GITHUB_RUN_ID.identity"
          umask 077
          : > "$relay_started"
          python3 tools/ab-auth/docker_loopback.py > "$AB_WORKDIR/relay.private.log" 2>&1 &
          relay_pid=$!
          python3 tools/ab-auth/relay_lifecycle.py capture "$relay_pid" "$relay_identity"
          for attempt in $(seq 1 30); do test -S "$AB_WORKDIR/docker-loopback.sock" && break; sleep 1; done
          test -S "$AB_WORKDIR/docker-loopback.sock"
          test "$(stat -c '%a' "$AB_WORKDIR/docker-loopback.sock")" = 600
          relay_host="unix://$AB_WORKDIR/docker-loopback.sock"
          pg='supabase/postgres@sha256:f2a84af37797675f0b27e27ea1fad2ebcd913ebf7ad60be05d7df0bcbd29e4b5'
          docker --host=unix:///var/run/docker.sock pull --platform linux/amd64 "$pg"
          observed_id="$(docker --host=unix:///var/run/docker.sock image inspect "$pg" --format '{{.Id}}')"
          expected_id="$(python3 -c 'import json; print(json.load(open("audits/02a5/EXPECTED-IMAGES.json"))["supabase/postgres:17.11.0.004"])')"
          printf 'POSTGRES_IMAGE_ID_OBSERVED=%s\nPOSTGRES_IMAGE_ID_EXPECTED=%s\n' "$observed_id" "$expected_id"
          test -n "$observed_id" && test -n "$expected_id" && test "$observed_id" = "$expected_id"
          docker --host=unix:///var/run/docker.sock tag "$pg" supabase/postgres:17.11.0.004
          if ! DOCKER_HOST="$relay_host" supabase start --workdir "$AB_WORKDIR" --network-id "$AB_NETWORK" --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit > "$AB_WORKDIR/start.private.log" 2>&1; then
            python3 tools/ab-auth/start_failure.py
            exit 1
          fi
          DOCKER_HOST="$relay_host" supabase status --workdir "$AB_WORKDIR" -o env > "$AB_WORKDIR/status.private.env"
          chmod 600 "$AB_WORKDIR/status.private.env"
          DOCKER_HOST="$relay_host" python3 - <<'PY'
          import json,subprocess,os
          expected=json.load(open('audits/02a5/EXPECTED-IMAGES.json'));seen={}
          for line in subprocess.check_output(['docker','ps','--format','{{json .}}'],text=True).splitlines():
            c=json.loads(line)
            if c['Names'].endswith('_'+os.environ['AB_PROJECT']):seen[c['Image']]=subprocess.check_output(['docker','inspect',c['Names'],'--format','{{.Image}}'],text=True).strip()
          print('IMAGE_IDENTITY_COMPARISON='+json.dumps({'expected':expected,'observed':seen},sort_keys=True))
          assert seen==expected, 'BLOCKED: image identity drift'
          print('IMAGE_IDENTITIES='+json.dumps(seen))
          PY
          DOCKER_HOST="$relay_host" docker ps -aq --filter label=com.supabase.cli.project="$AB_PROJECT" | sort -u > "$AB_WORKDIR/containers.receipt"
          test -s "$AB_WORKDIR/containers.receipt"
          chmod 600 "$AB_WORKDIR/containers.receipt"
          all_volumes=$(docker --host=unix:///var/run/docker.sock volume ls --format '{{.Name}}')
          : > "$AB_WORKDIR/volumes.receipt"
          while IFS= read -r volume_name; do
            case "$volume_name" in *"$AB_PROJECT"*) printf '%s\n' "$volume_name" >> "$AB_WORKDIR/volumes.receipt" ;; esac
          done <<< "$all_volumes"
          chmod 600 "$AB_WORKDIR/volumes.receipt"
          relay_state=$(python3 tools/ab-auth/relay_lifecycle.py stop "$relay_identity" --parent-reap)
          case "$relay_state" in ABSENT|REAP_REQUIRED) ;; *) echo "BLOCKED: relay stop state=$relay_state"; exit 1 ;; esac
          set +e
          wait "$relay_pid"
          relay_status=$?
          set -e
          test "$relay_status" -eq 143
          test ! -e "/proc/$relay_pid"
          rm -f "$AB_WORKDIR/docker-loopback.sock"
          test ! -e "$AB_WORKDIR/docker-loopback.sock"
          test -f "$AB_WORKDIR/status.private.env"
          sudo -u neroxa_test python3 tools/ab-auth/probe_private_workdir.py "$AB_WORKDIR"
          echo 'PREP_RELAY=stopped and reaped; socket removed before focal phase'
      - name: Privileged supervisor; focal client uses unprivileged UID
        run: |
          set -euo pipefail
          test ! -e "$AB_WORKDIR/docker-loopback.sock"
          test -f "$AB_WORKDIR/status.private.env"
          sudo -u neroxa_test python3 tools/ab-auth/probe_private_workdir.py "$AB_WORKDIR"
          sudo -u neroxa_test python3 - <<'PY'
          import errno,os,socket,stat
          path='/var/run/docker.sock'
          try: info=os.lstat(path)
          except FileNotFoundError: print('DOCKER_SOCKET_BOUNDARY=absent-before-focal'); raise SystemExit(0)
          if not stat.S_ISSOCK(info.st_mode): raise SystemExit('BLOCKED: Docker socket path is not a socket')
          s=socket.socket(socket.AF_UNIX)
          try: s.connect(path)
          except OSError as e:
            if e.errno in (errno.EACCES,errno.EPERM): print('DOCKER_SOCKET_BOUNDARY=denied-before-focal')
            else: raise SystemExit('BLOCKED: Docker socket denial was inconclusive: '+str(e.errno))
          else: raise SystemExit('BLOCKED: focal UID can connect to Docker socket')
          finally: s.close()
          PY
          node --experimental-strip-types tools/mission-02a3/proof1-focal-generated.private.mjs | tee "$RUNNER_TEMP/proof1-focal.log"
      - name: Require three focal assertions
        if: always()
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/proof1-focal.log"
          result=$(grep 'PROVA1_FOCAL_RESULT=' "$RUNNER_TEMP/proof1-focal.log" | tail -n 1 | sed 's/^.*PROVA1_FOCAL_RESULT=//')
          test "$(grep -c '^PROVA1_FOCAL_RESULT=' "$RUNNER_TEMP/proof1-focal.log")" = 1
          python3 -c 'import json,sys; r=json.loads(sys.argv[1]); assert r["status"]=="PASS PROVA1_FOCAL"; checks=r["proof1"]["checks"]; assert len(checks)==3; c={x["id"]:x["status"] for x in checks}; assert c=={"negative-read":"PASS","negative-write":"PASS","positive-capability":"PASS"}' "$result"
      - name: Cleanup privileged disposable resources
        if: always()
        env:
          LAB_OUTCOME: ${{ steps.lab.outcome }}
        run: |
          set +e
          set -uo pipefail
          cleanup_failed=0
          cleanup_unknown=0
          cleanup_resources_inactive=1
          case "${LAB_OUTCOME:-}" in success|failure|cancelled|skipped) ;; *) echo 'CLEANUP_UNKNOWN=lab outcome unavailable'; cleanup_unknown=1; cleanup_resources_inactive=0 ;; esac
          expected_workdir="$RUNNER_TEMP/02a5-buyer-$GITHUB_RUN_ID"
          if [ -z "${AB_WORKDIR:-}" ]; then
            if [ -d "$expected_workdir" ]; then AB_WORKDIR="$expected_workdir"
            else AB_WORKDIR=; if [ "${LAB_OUTCOME:-}" != skipped ]; then cleanup_unknown=1; cleanup_resources_inactive=0; fi
            fi
          fi
          if [ "$AB_WORKDIR" != "$expected_workdir" ]; then echo 'CLEANUP_FAIL=workdir scope mismatch'; AB_WORKDIR=''; cleanup_failed=1; cleanup_unknown=1; cleanup_resources_inactive=0; fi
          export DOCKER_HOST=unix:///var/run/docker.sock
          # Services and their consumers are stopped while egress restrictions remain installed.
          if [ -n "${AB_WORKDIR:-}" ] && [ -f "$AB_WORKDIR/supabase/config.toml" ]; then
            supabase stop --workdir "$AB_WORKDIR" --no-backup || { echo 'CLEANUP_FAIL=supabase stop'; cleanup_failed=1; cleanup_resources_inactive=0; }
          elif [ -n "${AB_WORKDIR:-}" ] && { [ -f "$AB_WORKDIR/start.private.log" ] || [ -f "$AB_WORKDIR/status.private.env" ]; }; then
            echo 'CLEANUP_UNKNOWN=service config absent after startup began'; cleanup_unknown=1; cleanup_resources_inactive=0
          fi
          all_container_ids=$(docker ps -aq)
          rc=$?
          if [ "$rc" -ne 0 ]; then echo 'CLEANUP_UNKNOWN=all-container inventory'; cleanup_unknown=1; cleanup_resources_inactive=0; all_container_ids=''
          fi
          remaining=$(docker ps -aq --filter label=com.supabase.cli.project="$AB_PROJECT")
          rc=$?
          if [ "$rc" -ne 0 ]; then echo 'CLEANUP_UNKNOWN=project-container inventory'; cleanup_unknown=1; cleanup_resources_inactive=0
          elif [ -n "$remaining" ]; then echo 'CLEANUP_FAIL=project containers remain'; cleanup_failed=1; cleanup_resources_inactive=0
          fi
          if [ -n "${AB_WORKDIR:-}" ] && [ -f "$AB_WORKDIR/containers.receipt" ]; then
            while IFS= read -r container_id; do
              [ -n "$container_id" ] || continue
              if ! [[ "$container_id" =~ ^[0-9a-f]{64}$ ]]; then echo 'CLEANUP_UNKNOWN=container receipt malformed'; cleanup_unknown=1; cleanup_resources_inactive=0
              elif grep -Fxq -- "$container_id" <<< "$all_container_ids"; then echo 'CLEANUP_FAIL=receipted container remains'; cleanup_failed=1; cleanup_resources_inactive=0
              fi
            done < "$AB_WORKDIR/containers.receipt"
          elif [ -n "${AB_WORKDIR:-}" ] && [ -f "$AB_WORKDIR/start.private.log" ]; then echo 'CLEANUP_UNKNOWN=container receipt missing'; cleanup_unknown=1; cleanup_resources_inactive=0
          fi
          network_id=''
          if [ -n "${AB_WORKDIR:-}" ] && [ -f "$AB_WORKDIR/network.receipt" ]; then
            mapfile -t network_receipt < "$AB_WORKDIR/network.receipt"
            if [ "${#network_receipt[@]}" -ne 2 ] || [ "${network_receipt[0]:-}" != "$AB_NETWORK" ] || ! [[ "${network_receipt[1]:-}" =~ ^[0-9a-f]{64}$ ]]; then echo 'CLEANUP_UNKNOWN=network receipt malformed'; cleanup_unknown=1; cleanup_resources_inactive=0
            else network_id=${network_receipt[1]}
            fi
          elif [ -n "${AB_WORKDIR:-}" ] && [ -f "$AB_WORKDIR/network.started" ]; then
            echo 'CLEANUP_UNKNOWN=network receipt missing after create attempt'; cleanup_unknown=1; cleanup_resources_inactive=0
          fi
          observed_network_id=''
          if docker network inspect "$AB_NETWORK" --format '{{.Id}}' >/dev/null 2>&1; then
            observed_network_id=$(docker network inspect "$AB_NETWORK" --format '{{.Id}}') || { echo 'CLEANUP_UNKNOWN=network identity'; cleanup_unknown=1; cleanup_resources_inactive=0; }
            if [ -n "$network_id" ] && [ "$network_id" != "$observed_network_id" ]; then echo 'CLEANUP_FAIL=network identity differs from receipt'; cleanup_failed=1; cleanup_resources_inactive=0; fi
            if [ -z "$network_id" ]; then echo 'CLEANUP_UNKNOWN=network receipt missing'; cleanup_unknown=1; cleanup_resources_inactive=0; fi
            network_id=$observed_network_id
            attached=$(docker network inspect "$AB_NETWORK" --format '{{json .Containers}}')
            rc=$?
            if [ "$rc" -ne 0 ]; then echo 'CLEANUP_UNKNOWN=network attachment inventory'; cleanup_unknown=1; cleanup_resources_inactive=0
            elif [ "$attached" != '{}' ] && [ "$attached" != 'null' ]; then echo 'CLEANUP_FAIL=network has attached containers'; cleanup_failed=1; cleanup_resources_inactive=0
            fi
          else
            all_networks=$(docker network ls --format '{{.Name}}')
            rc=$?
            if [ "$rc" -ne 0 ]; then echo 'CLEANUP_UNKNOWN=network list unavailable'; cleanup_unknown=1; cleanup_resources_inactive=0
            elif grep -Fxq -- "$AB_NETWORK" <<< "$all_networks"; then echo 'CLEANUP_UNKNOWN=network exists but inspect failed'; cleanup_unknown=1; cleanup_resources_inactive=0
            fi
          fi
          critical_processes_remain=0
          relay_started="$RUNNER_TEMP/proof1-relay-$GITHUB_RUN_ID.started"
          relay_identity="$RUNNER_TEMP/proof1-relay-$GITHUB_RUN_ID.identity"
          if [ -e "$relay_started" ]; then
            if [ ! -s "$relay_identity" ]; then
              echo 'CLEANUP_UNKNOWN=relay identity receipt missing'; cleanup_unknown=1; critical_processes_remain=1
            else
              relay_state=$(python3 tools/ab-auth/relay_lifecycle.py stop "$relay_identity")
              relay_rc=$?
              case "$relay_state:$relay_rc" in
                ABSENT:0) echo 'CLEANUP_RELAY_PROCESS=absent' ;;
                TIMEOUT:1) echo 'CLEANUP_FAIL=relay termination timeout'; cleanup_failed=1; critical_processes_remain=1 ;;
                *) echo 'CLEANUP_UNKNOWN=relay termination/identity/reap unconfirmed'; cleanup_unknown=1; critical_processes_remain=1 ;;
              esac
            fi
          elif [ -e "$relay_identity" ]; then
            echo 'CLEANUP_UNKNOWN=relay receipt without launch marker'; cleanup_unknown=1; critical_processes_remain=1
          fi
          if [ -n "${AB_WORKDIR:-}" ] && [ -S "$AB_WORKDIR/docker-loopback.sock" ]; then rm -f "$AB_WORKDIR/docker-loopback.sock" || { echo 'CLEANUP_FAIL=relay socket removal'; cleanup_failed=1; }; fi
          if [ -n "${AB_WORKDIR:-}" ] && [ -e "$AB_WORKDIR/docker-loopback.sock" ]; then echo 'CLEANUP_FAIL=relay socket remains'; cleanup_failed=1; critical_processes_remain=1; fi
          focal_processes_remain=0
          focal_uid=''
          actual_uid=$(id -u neroxa_test 2>/dev/null || true)
          if [ -f "$RUNNER_TEMP/proof1-test-uid.receipt" ]; then
            expected_uid=$(cat "$RUNNER_TEMP/proof1-test-uid.receipt")
            if [[ "$expected_uid" =~ ^[0-9]+$ ]]; then focal_uid=$expected_uid
            else echo 'CLEANUP_UNKNOWN=test UID receipt malformed'; cleanup_unknown=1; focal_processes_remain=1
            fi
            if [ -n "$actual_uid" ] && [ "$actual_uid" != "$expected_uid" ]; then echo 'CLEANUP_UNKNOWN=test UID identity changed'; cleanup_unknown=1; focal_processes_remain=1; fi
          elif [ -n "$actual_uid" ]; then
            focal_uid=$actual_uid
            echo 'CLEANUP_UNKNOWN=test UID receipt missing'; cleanup_unknown=1; focal_processes_remain=1
          fi
          if [ -n "$focal_uid" ]; then
            process_list=$(ps -eo uid=,pid=)
            rc=$?
            if [ "$rc" -ne 0 ]; then echo 'CLEANUP_UNKNOWN=process inventory unavailable'; cleanup_unknown=1; focal_processes_remain=1
            else
              focal_pids=$(awk -v uid="$focal_uid" '$1==uid {print $2}' <<< "$process_list")
              if [ -n "$focal_pids" ]; then echo 'CLEANUP_UNKNOWN=focal UID process still active; firewall retained'; cleanup_unknown=1; focal_processes_remain=1; fi
            fi
          fi
          if [ "$cleanup_resources_inactive" -eq 1 ] && [ "$focal_processes_remain" -eq 0 ] && [ "$critical_processes_remain" -eq 0 ] && [ "$cleanup_failed" -eq 0 ] && [ "$cleanup_unknown" -eq 0 ]; then
            # Only after service/process inventories are conclusive can the egress policy be removed.
            firewall_unlock_ok=0
            if AB_NETWORK_ID="$network_id" bash tools/mission-02a5/network.sh unlock; then firewall_unlock_ok=1
            else echo 'CLEANUP_FAIL=firewall unlock'; cleanup_failed=1
            fi
            firewall_absent=1
            project_bridge=''
            if [ -n "$network_id" ]; then project_bridge="br-${network_id:0:12}"; fi
            for save in iptables-save ip6tables-save; do
              if rules=$(sudo "$save"); then
                if grep -q 'NEROXA02A5' <<< "$rules"; then echo "CLEANUP_FAIL=$save NEROXA02A5 rule remains"; cleanup_failed=1; firewall_absent=0; fi
                if [ -n "$project_bridge" ] && grep -Fq -- "-i $project_bridge " <<< "$rules"; then echo "CLEANUP_FAIL=$save bridge rule remains"; cleanup_failed=1; firewall_absent=0; fi
              else echo "CLEANUP_UNKNOWN=$save inventory unavailable"; cleanup_unknown=1; firewall_absent=0; fi
            done
            if [ "$firewall_unlock_ok" -ne 1 ]; then firewall_absent=0; fi
            # Preserve the bridge and its evidence unless both firewall inventories prove absence.
            if [ "$firewall_absent" -eq 1 ] && [ "$cleanup_failed" -eq 0 ] && [ "$cleanup_unknown" -eq 0 ] && [ -n "$network_id" ]; then
              networks=$(docker network ls --filter name="^${AB_NETWORK}$" --format '{{.Name}}')
              rc=$?
              if [ "$rc" -ne 0 ]; then echo 'CLEANUP_UNKNOWN=network inventory before removal'; cleanup_unknown=1
              elif [ -n "$networks" ]; then docker network rm "$AB_NETWORK" || { echo 'CLEANUP_FAIL=network removal'; cleanup_failed=1; }
              fi
            fi
            networks=$(docker network ls --filter name="^${AB_NETWORK}$" --format '{{.Name}}')
            rc=$?
            if [ "$rc" -ne 0 ]; then echo 'CLEANUP_UNKNOWN=network inventory'; cleanup_unknown=1
            elif [ -n "$networks" ]; then echo 'CLEANUP_FAIL=network absence unconfirmed'; cleanup_failed=1
            fi
          fi
          remaining=$(docker ps -aq --filter label=com.supabase.cli.project="$AB_PROJECT")
          rc=$?
          if [ "$rc" -ne 0 ]; then echo 'CLEANUP_UNKNOWN=final container inventory'; cleanup_unknown=1
          elif [ -n "$remaining" ]; then echo 'CLEANUP_FAIL=containers remain'; cleanup_failed=1
          fi
          volumes=$(docker volume ls --format '{{.Name}}')
          rc=$?
          if [ "$rc" -ne 0 ]; then echo 'CLEANUP_UNKNOWN=volume inventory'; cleanup_unknown=1
          elif grep -Fq -- "$AB_PROJECT" <<< "$volumes"; then echo 'CLEANUP_FAIL=project volumes remain'; cleanup_failed=1
          fi
          if [ -n "${AB_WORKDIR:-}" ] && [ -f "$AB_WORKDIR/start.private.log" ] && [ ! -f "$AB_WORKDIR/volumes.receipt" ]; then echo 'CLEANUP_UNKNOWN=volume receipt missing'; cleanup_unknown=1; fi
          if [ -n "${AB_WORKDIR:-}" ] && [ -f "$AB_WORKDIR/volumes.receipt" ]; then
            while IFS= read -r volume_name; do
              [ -n "$volume_name" ] || continue
              if grep -Fxq -- "$volume_name" <<< "$volumes"; then echo 'CLEANUP_FAIL=receipted volume remains'; cleanup_failed=1; fi
            done < "$AB_WORKDIR/volumes.receipt"
          fi
          if [ "$cleanup_resources_inactive" -eq 1 ] && [ "$focal_processes_remain" -eq 0 ] && [ "$critical_processes_remain" -eq 0 ] && [ "$cleanup_failed" -eq 0 ] && [ "$cleanup_unknown" -eq 0 ]; then
            if [ -f "$RUNNER_TEMP/proof1-test-uid.receipt" ]; then
              expected_uid=$(cat "$RUNNER_TEMP/proof1-test-uid.receipt")
              actual_uid=$(id -u neroxa_test 2>/dev/null || true)
              if [[ "$expected_uid" =~ ^[0-9]+$ ]] && [ "$actual_uid" = "$expected_uid" ]; then
                sudo userdel neroxa_test || { echo 'CLEANUP_FAIL=test UID removal'; cleanup_failed=1; }
              elif [ -n "$actual_uid" ]; then echo 'CLEANUP_UNKNOWN=test UID identity mismatch'; cleanup_unknown=1
              fi
            elif id neroxa_test >/dev/null 2>&1; then echo 'CLEANUP_UNKNOWN=test UID receipt missing'; cleanup_unknown=1
            fi
          fi
          if [ "$cleanup_resources_inactive" -eq 1 ] && [ "$focal_processes_remain" -eq 0 ] && [ "$critical_processes_remain" -eq 0 ] && [ "$cleanup_failed" -eq 0 ] && [ "$cleanup_unknown" -eq 0 ]; then
            if id neroxa_test >/dev/null 2>&1; then echo 'CLEANUP_FAIL=test UID remains'; cleanup_failed=1; fi
            if [ -n "${AB_WORKDIR:-}" ] && [ -e "$AB_WORKDIR" ]; then rm -rf -- "$AB_WORKDIR" || { echo 'CLEANUP_FAIL=private workdir removal'; cleanup_failed=1; }; fi
            if [ -n "${AB_WORKDIR:-}" ] && [ -e "$AB_WORKDIR" ]; then echo 'CLEANUP_FAIL=private workdir remains'; cleanup_failed=1; fi
          fi
          if [ "$cleanup_resources_inactive" -eq 1 ] && [ "$focal_processes_remain" -eq 0 ] && [ "$critical_processes_remain" -eq 0 ] && [ "$cleanup_failed" -eq 0 ] && [ "$cleanup_unknown" -eq 0 ]; then
            rm -f "$RUNNER_TEMP/proof1-focal.log" "$RUNNER_TEMP/proof1-test-uid.receipt" "$RUNNER_TEMP/proof1-relay-$GITHUB_RUN_ID.started" "$RUNNER_TEMP/proof1-relay-$GITHUB_RUN_ID.identity" || { echo 'CLEANUP_FAIL=temporary receipt removal'; cleanup_failed=1; }
          fi
          if [ "$cleanup_unknown" -ne 0 ]; then echo 'CLEANUP=UNKNOWN'; exit 1; fi
          if [ "$cleanup_failed" -ne 0 ]; then echo 'CLEANUP=FAIL'; exit 1; fi
          echo 'CLEANUP=PASS; services stopped, relay reaped, firewall absent, network/containers/volumes/workdir/test UID absent'
