name: TEMP PR89 — finish four Prettier diffs, no workflow write token

on:
  push:
    branches:
      - fix/neroxa-master-typed-catalog-editors-20261125

permissions:
  contents: read

jobs:
  format-four:
    if: >-
      github.repository == 'luit77yak-dev/neroxa-master' &&
      github.actor == 'luit77yak-dev' &&
      github.ref == 'refs/heads/fix/neroxa-master-typed-catalog-editors-20261125' &&
      github.event.head_commit.message == 'TRIGGER_SAFE_PRETTIER_FOUR_ONLY' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact feature revision without token persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'
      - name: Install locked package tree, no lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format precisely the remaining four files and verify
        shell: bash
        run: |
          set -euo pipefail
          readonly -a files=(
            'src/features/master/subscriptions/services.ts'
            'src/routes/master-catalogo.tsx'
            '.github/workflows/proof1-focal.yml'
            '.github/workflows/rg02-synthetic-checks.yml'
          )
          npx prettier --write "${files[@]}" > /dev/null
          npx prettier --check "${files[@]}"
          mkdir -p "$RUNNER_TEMP/rg02-reviewed-workflows"
          cp .github/workflows/proof1-focal.yml "$RUNNER_TEMP/rg02-reviewed-workflows/proof1-focal.yml"
          cp .github/workflows/rg02-synthetic-checks.yml "$RUNNER_TEMP/rg02-reviewed-workflows/rg02-synthetic-checks.yml"
          git diff --check
          echo 'FOUR_FILES_PRETTIER=PASS; PRIVATE_DATA=NONE; COMMERCIAL_GO=NO_GO'
      - name: Upload only formatted workflow texts for separate review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr89-reviewed-workflow-format-${{ github.sha }}
          path: ${{ runner.temp }}/rg02-reviewed-workflows/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Push only the two ordinary TypeScript file changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/neroxa-master-typed-catalog-editors-20261125'
          git add -u -- src/features/master/subscriptions/services.ts src/routes/master-catalogo.tsx
          if git diff --cached --quiet; then
            echo 'PR89_TYPED_FILES=ALREADY_FORMATTED'
          else
            test "$(git diff --cached --name-only | wc -l)" -le 2
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(master): finish Prettier on remaining two TS files (PR 89)' > /dev/null
            gh auth setup-git
            git push origin HEAD:refs/heads/fix/neroxa-master-typed-catalog-editors-20261125 > /dev/null
            echo 'PR89_TS_PRETTIER=COMMITTED'
          fi
