name: NEROXA V1 Integration Static Guard
on:
  push:
    branches:
      - 'integration/v1-cloudflare-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-preflight:
    name: Offline master release guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate guard with synthetic negative tests
        run: node --test tools/integration/guard-release.test.mjs
      - name: Verify signed Cloudflare deployment identity fails closed (synthetic)
        run: node --test tools/integration/cloudflare-hosted-identity.test.mjs
      - name: Validate hosted import closure checker with synthetic positive and negative fixtures
        run: node --test tools/hosted-admission/import-closure-audit.test.mjs
      - name: Verify original Delivery hosted core blob was recovered without modification
        run: |
          test "$(git hash-object delivery-candidate/src/server/hosted-release-core.mjs)" = "394edd40004f259daa01ab95496ef8fc042416da"
          echo 'HOSTED_CORE_SOURCE_BLOB=PASS; imported exact historical source' >> "$GITHUB_STEP_SUMMARY"
      - name: Require hosted executor static import closure (no execution)
        run: node tools/hosted-admission/import-closure-audit.mjs . tools/hosted-admission/preflight-entry.mjs tools/hosted-admission/session.mjs
      - name: Execute synthetic hosted-admission unit tests (no credentials)
        run: node --test tests/hosted-admission/local.test.mjs tests/hosted-admission/preflight.test.mjs
      - name: Verify master candidate remains closed
        run: node tools/integration/guard-release.mjs master .
