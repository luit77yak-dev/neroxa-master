name: NEROXA RESTORE-GATE-01 — approved isolated content recovery

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RESTORE_ISOLATED_ONLY (one ephemeral attempt)
        required: true
        type: string
      manifest_key:
        description: Cloudflare KV manifest key (not confidential)
        required: true
        type: string
      expected_cipher_sha256:
        description: Ciphertext SHA-256 from Termux local.json (not confidential)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neroxa-commercial-restore-gate01
  cancel-in-progress: false

jobs:
  restore-content-only:
    if: >-
      github.repository == 'luit77yak-dev/neroxa-master' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected &&
      github.run_attempt == 1 &&
      (github.actor == 'luit77yak-dev' || github.actor == 'dev-luizt5') &&
      inputs.confirmation == 'RESTORE_ISOLATED_ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: neroxa-restore-gate01
    env:
      RG01_ACCOUNT_ID: ${{ vars.RG01_ACCOUNT_ID }}
      RG01_NAMESPACE_ID: ${{ vars.RG01_NAMESPACE_ID }}
      RG01_REVIEW_GATE: ${{ vars.RG01_REVIEW_GATE }}
      RG01_KV_READ_TOKEN: ${{ secrets.RG01_KV_READ_TOKEN }}
      RG01_DECRYPT_KEY: ${{ secrets.RG01_DECRYPT_KEY }}
      RG01_MANIFEST_KEY: ${{ inputs.manifest_key }}
      RG01_EXPECTED_CIPHER_SHA256: ${{ inputs.expected_cipher_sha256 }}
      PG_IMAGE: supabase/postgres:17.12.0.002
    steps:
      - name: Checkout exact protected revision, without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Recover content into isolated PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RG01_REVIEW_GATE" = 'ARMED_AFTER_OPERATOR_APPROVAL'
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          test "$GITHUB_REF_PROTECTED" = 'true'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          command -v docker >/dev/null
          command -v python3 >/dev/null
          command -v gpg >/dev/null
          echo 'ISOLATED_RUNNER=PASS; PRODUCTION_DATABASE_ACCESS=NONE'

          TMP="$(mktemp -d "$RUNNER_TEMP/neroxa-restore-gate01.XXXXXXXX")"
          CONTAINER="neroxa-rg01-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            rm -rf -- "$TMP"
          }
          trap cleanup EXIT

          python3 tools/restore-gate01/restore_from_kv.py \
            --manifest-key "$RG01_MANIFEST_KEY" \
            --expected-sha256 "$RG01_EXPECTED_CIPHER_SHA256" \
            --output "$TMP/database.dump"

          timeout 240s docker pull "$PG_IMAGE" >/dev/null
          echo 'PG17_IMAGE=PASS'
          PASSWORD="$(openssl rand -hex 32)"
          docker run --rm --detach \
            --name "$CONTAINER" \
            --network none \
            --security-opt no-new-privileges \
            --tmpfs /var/lib/postgresql/data:rw,nosuid,nodev,size=1536m \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            -e POSTGRES_PASSWORD="$PASSWORD" \
            "$PG_IMAGE" >/dev/null
          unset PASSWORD
          READY=0
          for i in $(seq 1 90); do
            if docker exec "$CONTAINER" pg_isready -q -h /var/run/postgresql -U supabase_admin -d postgres; then
              READY=1
              break
            fi
            sleep 2
          done
          test "$READY" = 1 || { echo 'PG17_BOOT=FAIL'; exit 1; }
          echo 'PG17_BOOT=PASS'

          VERSION="$(docker exec "$CONTAINER" psql -X -At -v ON_ERROR_STOP=1 \
            -h /var/run/postgresql -U supabase_admin -d postgres -c 'SHOW server_version;')"
          case "$VERSION" in 17.*) echo 'PG17_VERSION=PASS';; *) echo 'PG17_VERSION=FAIL'; exit 1;; esac
          docker exec "$CONTAINER" psql -X -v ON_ERROR_STOP=1 \
            -h /var/run/postgresql -U supabase_admin -d postgres \
            -c 'CREATE DATABASE neroxa_restore_probe;' >/dev/null 2>&1
          docker exec "$CONTAINER" psql -X -v ON_ERROR_STOP=1 \
            -h /var/run/postgresql -U supabase_admin -d neroxa_restore_probe \
            -c "CREATE EXTENSION IF NOT EXISTS supabase_vault WITH VERSION '0.3.1';" >/dev/null 2>&1
          echo 'VAULT_0_3_1_CREATE=PASS'

          # Stream bytes into isolated tmpfs and verify them before pg_restore.
          # No backup bytes are printed or uploaded as artifacts.
          test -s "$TMP/database.dump" || { echo "CONTAINER_DUMP_SOURCE=BLOCKED"; exit 1; }
          docker exec -i "$CONTAINER" sh -c 'umask 077; cat > /tmp/database.dump' < "$TMP/database.dump"
          EXPECTED_BYTES="$(wc -c < "$TMP/database.dump" | tr -d '[:space:]')"
          ACTUAL_BYTES="$(docker exec "$CONTAINER" sh -c 'test -f /tmp/database.dump && wc -c < /tmp/database.dump' | tr -d '[:space:]')" || {
            echo "CONTAINER_DUMP_TRANSFER=BLOCKED_NOT_FOUND"; exit 1;
          }
          test "$EXPECTED_BYTES" = "$ACTUAL_BYTES" || {
            echo "CONTAINER_DUMP_TRANSFER=BLOCKED_SIZE_MISMATCH"; exit 1;
          }
          HOST_SHA="$(sha256sum "$TMP/database.dump" | cut -d' ' -f1)"
          CONTAINER_SHA="$(docker exec "$CONTAINER" sha256sum /tmp/database.dump | cut -d' ' -f1)"
          test "$HOST_SHA" = "$CONTAINER_SHA" || {
            echo "CONTAINER_DUMP_TRANSFER=BLOCKED_HASH_MISMATCH"; exit 1;
          }
          echo "CONTAINER_DUMP_TRANSFER=PASS; CONTAINER_DUMP_SHA256=PASS"
          # Vault 0.3.1 pre-creates schema vault. The dump can also carry
          # CREATE SCHEMA vault: omit ONLY that redundant TOC entry.
          # TOC contains private schema names: keep it off public logs/artifacts.
          docker exec "$CONTAINER" pg_restore -l /tmp/database.dump > "$TMP/restore.full.list"
          VAULT_TOC_COUNT="$(grep -Ec '^[[:digit:]]+; [[:digit:]]+ [[:digit:]]+ SCHEMA - vault ' "$TMP/restore.full.list" || true)"
          test "$VAULT_TOC_COUNT" = "1" || { echo 'VAULT_TOC_SCHEMA=BLOCKED'; exit 1; }
          sed -E '/^[[:digit:]]+; [[:digit:]]+ [[:digit:]]+ SCHEMA - vault /d' \
            "$TMP/restore.full.list" > "$TMP/restore.filtered.list"
          # Transfer the filtered TOC through stdin as well: /tmp is a container tmpfs.
          # Compare digests without logging private schema names or list contents.
          test -s "$TMP/restore.filtered.list" || { echo 'FILTERED_TOC_SOURCE=BLOCKED'; exit 1; }
          docker exec -i "$CONTAINER" sh -c 'umask 077; cat > /tmp/restore.filtered.list' < "$TMP/restore.filtered.list"
          FILTERED_TOC_HOST_SHA="$(sha256sum "$TMP/restore.filtered.list" | cut -d' ' -f1)"
          FILTERED_TOC_CONTAINER_SHA="$(docker exec "$CONTAINER" sha256sum /tmp/restore.filtered.list | cut -d' ' -f1)"
          test "$FILTERED_TOC_HOST_SHA" = "$FILTERED_TOC_CONTAINER_SHA" || {
            echo 'FILTERED_TOC_TRANSFER=BLOCKED_HASH_MISMATCH'; exit 1;
          }
          echo 'FILTERED_TOC_TRANSFER=PASS'
          echo 'VAULT_0_3_1_COMPATIBILITY_TOC=PASS'

          if timeout 360s docker exec "$CONTAINER" pg_restore \
            --exit-on-error --single-transaction --no-owner --no-acl \
            --use-list=/tmp/restore.filtered.list \
            -h /var/run/postgresql -U supabase_admin \
            -d neroxa_restore_probe /tmp/database.dump \
            >"$TMP/restore.stdout" 2>"$TMP/restore.stderr"; then
            echo 'ISOLATED_CONTENT_RESTORE=PASS'
          else
            echo 'ISOLATED_CONTENT_RESTORE=FAIL_REDACTED'
            echo 'RESTORE_DIAGNOSTICS=PRIVATE_NOT_UPLOADED'
            exit 1
          fi

          VAULT="$(docker exec "$CONTAINER" psql -X -At -v ON_ERROR_STOP=1 \
            -h /var/run/postgresql -U supabase_admin -d neroxa_restore_probe \
            -c "SELECT extversion FROM pg_extension WHERE extname='supabase_vault';")"
          test "$VAULT" = '0.3.1'
          echo 'VAULT_VERSION_AFTER_RESTORE=PASS'
          TABLES="$(docker exec "$CONTAINER" psql -X -At -v ON_ERROR_STOP=1 \
            -h /var/run/postgresql -U supabase_admin -d neroxa_restore_probe \
            -c "SELECT count(*) FROM pg_class WHERE relkind='r' AND relnamespace NOT IN ('pg_catalog'::regnamespace, 'information_schema'::regnamespace);")"
          [[ "$TABLES" =~ ^[0-9]+$ ]]
          test "$TABLES" -gt 0
          echo "RESTORED_USER_TABLE_COUNT=$TABLES"
          echo 'NO_REMOTE_WRITES=PASS; CONTAINER_NETWORK=NONE'
          echo 'GLOBAL_ROLES=NOT_RUN; OWNER_ACL=NOT_VERIFIED'
          echo 'COMMERCIAL_RESTORE_COMPLETE=NO; COMMERCIAL_GO=NO_GO'
