name: PR43 compatibility lightweight integration validation
on:
  push:
    branches:
      - audit/pr43-merge-check-20261103
permissions:
  contents: read
jobs:
  validate:
    name: lint-test-build-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout combined PR43 and latest base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Candidate and harness static validation only
        run: |
          set -euo pipefail
          node --check tools/mission-02a3/run.mjs
          node --check tools/mission-02a3/native-realtime.mjs
          node --check tools/mission-02a4/addons.mjs
          python3 - <<'PY'
          import json,pathlib,hashlib,subprocess
          cfg=json.loads(pathlib.Path('vercel.json').read_text())
          for b in ['audit/pr43-merge-check-20261103','security/mission-02a4-compat-harness-20261014','security/mission-02a4-availability-20261014']:
              assert cfg['git']['deploymentEnabled'].get(b) is False,b
          mf=json.loads(pathlib.Path('audits/02a4/MANIFEST.json').read_text())
          for path,digest in mf['files'].items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==digest,path
          legacy=json.loads(pathlib.Path('audits/02a4/LEGACY-MANIFEST.json').read_text())
          assert len(legacy['files'])==31
          sql=pathlib.Path('audits/02a4/addon-explicit-membership.candidate.sql').read_text()
          assert 'mission02a2_disposable' in sql and 'mission02a2_scope_cap' in sql
          assert 'has_delivery_instance_role' in sql
          changed=subprocess.check_output(['git','diff','--name-only','1697ac3b3eab71041535bfb19d4dafc95f295ed6','HEAD'],text=True).splitlines()
          assert not any(p.startswith('supabase/migrations/') for p in changed), 'new production migration'
          print('COMPATIBILITY-CANDIDATE=PASS; DATABASE-NOT-RUN; NO-DEPLOY')
          PY
