name: NEROXA V1 Commercial Postgres TLS Probe (No Secrets)

on:
  push:
    branches:
      - 'integration/v1-cloudflare-*'
    paths:
      - 'tools/hosted-admission/commercial-network-tls-probe.py'
      - '.github/workflows/v1-commercial-tls-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tls-network-only:
    name: DNS / TCP / PostgreSQL TLS verification (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout pinned integration code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Probe commercial PostgreSQL TLS without credentials
        run: python3 tools/hosted-admission/commercial-network-tls-probe.py
      - name: Declare scope in job summary
        run: |
          echo 'This job checks public DNS, PostgreSQL STARTTLS, CA and hostname only.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No secrets, SQL, account credentials, deployment or migration were used.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A successful job is **not** an authenticated HOSTED_PREFLIGHT, SQL_RELEASE, or GO.' >> "$GITHUB_STEP_SUMMARY"
