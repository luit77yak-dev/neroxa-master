name: F02 Delivery historical catalog - disposable pre-gate only
on:
  push:
    branches: [security/mission-02a5-integration-local-20261014]
    paths:
      - '.github/workflows/mission-02a5-f02-delivery-catalog.yml'
      - 'audits/02a5/f02-delivery/**'
permissions:
  contents: read
jobs:
  historical-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: luit77yak-dev/pizza-perfect-plate
          ref: 4ce88959a751066f96da4cbab8d1fc9ac29bb320
          path: delivery-historical
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.0'
      - name: Validate public standard disposable runner and exact sources
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          python3 -c 'import json,os; j=json.load(open(os.environ["GITHUB_EVENT_PATH"])); assert j["repository"]["private"] is False and j["repository"]["visibility"] == "public"'
          test "$(git -C delivery-historical rev-parse HEAD)" = 4ce88959a751066f96da4cbab8d1fc9ac29bb320
          test "$(df --output=avail -B1 "$RUNNER_TEMP" | tail -1)" -gt 8589934592
          echo "AB_PROJECT=neroxa-f02-delivery-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          echo "AB_NETWORK=neroxa-f02-delivery-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          echo 'PROFILE=HISTORICAL_DELIVERY_DISPOSABLE; NO_REMOTE_SQL; NO_GATE; NO_RELEASE'
      - name: Install pinned local Supabase CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/cli" --no-audit --no-fund supabase@2.120.0
          echo "$RUNNER_TEMP/cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Create isolated PostgreSQL 17 Supabase stack
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: |
          export AB_WORKDIR="$RUNNER_TEMP/f02-delivery-$GITHUB_RUN_ID"
          echo "AB_WORKDIR=$AB_WORKDIR" >> "$GITHUB_ENV"
          mkdir -m 700 "$AB_WORKDIR"
          supabase init --workdir "$AB_WORKDIR"
          python3 tools/ab-auth/configure.py
          test ! -f "$AB_WORKDIR/supabase/.temp/project-ref"
          test ! -d "$AB_WORKDIR/supabase/migrations"
          docker network create --driver bridge --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 "$AB_NETWORK"
          python3 tools/ab-auth/docker_loopback.py > "$AB_WORKDIR/relay.private.log" 2>&1 &
          echo $! > "$AB_WORKDIR/relay.pid"
          for attempt in $(seq 1 30); do test -S "$AB_WORKDIR/docker-loopback.sock" && break; sleep 1; done
          test -S "$AB_WORKDIR/docker-loopback.sock"
          export DOCKER_HOST="unix://$AB_WORKDIR/docker-loopback.sock"
          echo "DOCKER_HOST=$DOCKER_HOST" >> "$GITHUB_ENV"
          if ! supabase start --workdir "$AB_WORKDIR" --network-id "$AB_NETWORK" --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit > "$AB_WORKDIR/start.private.log" 2>&1; then
            python3 tools/ab-auth/start_failure.py
            exit 1
          fi
          supabase status --workdir "$AB_WORKDIR" -o env > "$AB_WORKDIR/status.private.env"
          chmod 600 "$AB_WORKDIR/status.private.env"
          python3 - <<'PY'
          import json,subprocess,os
          expected=json.load(open('audits/02a5/EXPECTED-IMAGES.json'));seen={}
          for line in subprocess.check_output(['docker','ps','--format','{{json .}}'],text=True).splitlines():
            c=json.loads(line)
            if c['Names'].endswith('_'+os.environ['AB_PROJECT']):
              seen[c['Image']]=subprocess.check_output(['docker','inspect',c['Names'],'--format','{{.Image}}'],text=True).strip()
          assert seen==expected, 'BLOCKED: image identity drift'
          print('DISPOSABLE_IMAGE_IDENTITIES=PASS')
          PY
      - name: Replay Delivery history and inspect pg catalog in ephemeral database
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          python3 audits/02a5/f02-delivery/replay_and_inspect.py \
            --checkout delivery-historical --expected-sha 4ce88959a751066f96da4cbab8d1fc9ac29bb320 \
            --project "$AB_PROJECT" --catalog audits/02a5/f02/catalog-pre-gate.readonly.sql
      - name: Clean up disposable Delivery clone only
        if: always()
        run: |
          if [ -n "$AB_WORKDIR" ] && sudo test -d "$AB_WORKDIR"; then
            sudo chown -R "$(id -u):$(id -g)" "$AB_WORKDIR"
          fi
          export DOCKER_HOST=unix:///var/run/docker.sock
          if [ -n "$AB_WORKDIR" ] && [ -f "$AB_WORKDIR/supabase/config.toml" ]; then
            supabase stop --workdir "$AB_WORKDIR" --no-backup
            if [ -f "$AB_WORKDIR/relay.pid" ]; then kill "$(cat "$AB_WORKDIR/relay.pid")" || true; fi
          fi
          if [ -n "$AB_NETWORK" ]; then docker --host=unix:///var/run/docker.sock network rm "$AB_NETWORK" || true; fi
          if [ -n "$AB_PROJECT" ]; then
            remaining=$(docker --host=unix:///var/run/docker.sock ps -aq --filter "label=com.supabase.cli.project=$AB_PROJECT")
            test -z "$remaining"
          fi
          echo 'F02_DELIVERY_CLEANUP=PASS; no uploads/dumps'
