name: RG02 — isolated Python synthetic checks

on:
  pull_request:
    paths:
      - "tools/restore-gate01/**"
      - ".github/workflows/rg02-synthetic-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rg02-local-pg17-sql-smoke:
    # The only network transfer is fetching the exact already-approved PG17
    # container image; the disposable DB itself uses --network none.
    if: github.repository == 'luit77yak-dev/neroxa-master'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - name: Checkout RG02 source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify native privileges SQL on disposable network-isolated PG17
        shell: bash
        run: bash tools/restore-gate01/tests/rg02_pg17_local_sql_smoke.sh
  rg02-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout non-secret source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Python RG02 ACL diagnostic tests
        run: python3 -m unittest discover -s tools/restore-gate01/tests -p 'test_rg02_acl_diagnostic.py' -v
      - name: Verify Python RG02 catalog reconciliation tests
        run: python3 -m unittest discover -s tools/restore-gate01/tests -p 'test_rg02_catalog_reconcile.py' -v
      - name: Verify Python RG02 ordered ACL tests
        run: python3 -m unittest discover -s tools/restore-gate01/tests -p 'test_rg02_acl_ordered.py' -v
      - name: Verify strictly targeted ACL catalog tests
        run: python3 -m unittest discover -s tools/restore-gate01/tests -p 'test_rg02_targeted_acl.py' -v
      - name: Verify RG02 grantor and global-role coverage
        run: python3 -m unittest discover -s tools/restore-gate01/tests -p 'test_rg02_grantor_global_evidence.py' -v
      - name: Verify PG17 mixed membership grammar and held role-edges
        run: python3 -m unittest discover -s tools/restore-gate01/tests -p 'test_rg02_membership_parser.py' -v
      - name: Verify PG17 role membership path projections (HOLD-only)
        run: python3 -m unittest discover -s tools/restore-gate01/tests -p 'test_rg02_role_paths.py' -v
      - name: Verify role GRANT syntax and pg_* catalog endpoint triage
        run: python3 -m unittest discover -s tools/restore-gate01/tests -p 'test_rg02_edge_syntax_triage.py' -v
      - name: Verify global parameter ACL GRANT scope remains HOLD
        run: python3 -m unittest discover -s tools/restore-gate01/tests -p 'test_rg02_global_grant_scope.py' -v
      - name: Verify cross-receipt proof matrix is HOLD and fail-closed
        run: python3 -m unittest discover -s tools/restore-gate01/tests -p 'test_rg02_proof_matrix.py' -v
      - name: Verify isolated-only native PG17 privilege witness, no secrets
        run: python3 -m unittest discover -s tools/restore-gate01/tests -p 'test_rg02_local_effective_rights.py' -v
      - name: Verify private tuple witness preflight rejects false provenance and swapped grants
        run: python3 -m unittest discover -s tools/restore-gate01/tests -p 'test_rg02_tuple_witness_preflight.py' -v
