name: F02 Delivery candidate isolated unit regressions (not E2E)
on:
  push:
    branches: [security/mission-02a5-integration-local-20261014]
    paths:
      - .github/workflows/mission-02a5-delivery-unit.yml
permissions:
  contents: read
jobs:
  unit-candidate:
    if: github.ref == 'refs/heads/security/mission-02a5-integration-local-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: luit77yak-dev/pizza-perfect-plate
          ref: 011275488660bfa1a9271b3e4c92e457f7638e34
          path: delivery-candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.0'
      - name: Verify pinned SHA and public standard runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          python3 - <<'PY'
          import json,os
          e=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          assert e['repository']['private'] is False
          assert e['repository']['visibility']=='public'
          print('FREE_STANDARD_PUBLIC_GITHUB_RUNNER=PASS')
          PY
          test "$(git -C delivery-candidate rev-parse HEAD)" = 011275488660bfa1a9271b3e4c92e457f7638e34
          test ! -e delivery-candidate/.env
          echo 'F02_DELIVERY_SOURCE_PIN=011275488660bfa1a9271b3e4c92e457f7638e34'
      - name: Install lockfile only (no untrusted lifecycle hooks)
        working-directory: delivery-candidate
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute private tracking, checkout, amendment, consumer regression suites
        working-directory: delivery-candidate
        run: |
          set -euo pipefail
          node --experimental-strip-types --test \
            tests/private-tracking.test.mjs \
            tests/private-tracking-backend.test.mjs \
            tests/order-amendment.test.mjs \
            tests/order-amendment-local-config.test.mjs \
            tests/order-consumer-safety.test.mjs \
            tests/checkout-gateway.test.mjs \
            tests/backend-configuration.test.mjs
          echo 'UNIT_SCOPE_ONLY__NO_REMOTE_DB__NO_BROWSER__GATE_BLOCKED__F01_F02_OPEN'
