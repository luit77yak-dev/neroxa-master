name: F02 hosted PostgreSQL read-only preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f02-hosted-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hosted-preflight:
    if: >-
      github.ref == 'refs/heads/integration/v1-cloudflare-master-20261120' &&
      github.ref_protected &&
      github.actor == 'dev-luizt5' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: f02-hosted-preflight
    env:
      F02_ENVIRONMENT: f02-hosted-preflight
    steps:
      - name: Verify the protected first-attempt context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/integration/v1-cloudflare-master-20261120"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "$GITHUB_ACTOR" = "dev-luizt5"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REPOSITORY" = "luit77yak-dev/neroxa-master"

      - name: Check local runner tools
        shell: bash
        run: |
          set -euo pipefail
          command -v node
          node --version
          command -v psql
          psql --version
          command -v openssl
          openssl version

      - name: Checkout the exact approved commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Provision these names only as secrets scoped to f02-hosted-preflight.
      # The job cannot start until that GitHub Environment's independent review passes.
      # No repository/org-level copies should be created.
      - name: Run the read-only hosted preflight
        shell: bash
        env:
          F02_PREFLIGHT_GRANT: ${{ secrets.F02_PREFLIGHT_GRANT }}
          F02_PREFLIGHT_CA_PEM: ${{ secrets.F02_PREFLIGHT_CA_PEM }}
          F02_PREFLIGHT_PASSWORD: ${{ secrets.F02_PREFLIGHT_PASSWORD }}
        run: node tools/hosted-admission/preflight-entry.mjs
