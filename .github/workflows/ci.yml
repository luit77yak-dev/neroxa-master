name: Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        id: dependencies
        run: npm install

      - name: Format check (non-mutating)
        run: npx prettier --check .

      - name: Lint
        # Report lint even when format fails; never waive the failing format check.
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run lint

      - name: Test
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build
      # Temporary one-off source-format repair for PR #89. Read-only token;
      # no automatic push, no secrets, no bypass of the Prettier failure.
      - name: Prepare reviewed Prettier files (temporary PR-only)
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/neroxa-master-typed-catalog-editors-20261125' && !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write . > /dev/null
          mkdir -p "$RUNNER_TEMP/neroxa-formatted-source"
          changed=0
          while IFS= read -r -d '' path; do
            mkdir -p "$RUNNER_TEMP/neroxa-formatted-source/$(dirname "$path")"
            cp -- "$path" "$RUNNER_TEMP/neroxa-formatted-source/$path"
            changed=$((changed + 1))
          done < <(git diff --name-only --diff-filter=M -z)
          test "$changed" -gt 0
          echo "PRETTIER_FORMATTED_FILES=$changed; COMMIT_OR_PUBLISH=NO"

      - name: Upload formatted files for reviewed GitHub API commit only
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/neroxa-master-typed-catalog-editors-20261125' && !cancelled() && steps.dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neroxa-prettier-reviewed-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/neroxa-formatted-source/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
