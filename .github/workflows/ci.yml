name: Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Install dependencies
        run: npm install
      - name: Format changed files on the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/store-isolation-candidate-20261011'
        shell: bash
        run: |
          git checkout "$GITHUB_HEAD_REF"
          git diff --name-only --diff-filter=ACMRT origin/main...HEAD |
            grep -E '\\.(ts|tsx|js|jsx|json|md|css|yml|yaml)
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACMRT origin/main...HEAD |
            grep -E '\.(ts|tsx|js|jsx|json|md|css|yml|yaml)$' > /tmp/format-files || true
          if [ -s /tmp/format-files ]; then
            xargs -d '\n' npx prettier --check < /tmp/format-files
          fi
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
 > /tmp/format-files || true
          if [ -s /tmp/format-files ]; then
            xargs -d '\\n' npx prettier --write < /tmp/format-files
            if ! git diff --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add -- $(cat /tmp/format-files)
              git commit -m 'style: format changed PR files'
              git push origin HEAD:"$GITHUB_HEAD_REF"
            fi
          fi
      - name: Format check (changed files only)
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACMRT origin/main...HEAD |
            grep -E '\.(ts|tsx|js|jsx|json|md|css|yml|yaml)$' > /tmp/format-files || true
          if [ -s /tmp/format-files ]; then
            xargs -d '\n' npx prettier --check < /tmp/format-files
          fi
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
