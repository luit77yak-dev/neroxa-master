name: Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Install dependencies
        run: npm install
      - name: Format check (changed files only)
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACMRT origin/main...HEAD |
            grep -E '\.(ts|tsx|js|jsx|json|md|css|yml|yaml)$' > /tmp/format-files || true
          if [ -s /tmp/format-files ]; then
            xargs -d '\n' npx prettier --check < /tmp/format-files
          fi
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
