name: Isolated A-B Auth Matrix

on:
  workflow_dispatch:
  push:
    branches: [audit/store-isolation-candidate-20261011]
    paths:
      - .github/workflows/isolated-ab-auth-smoke.yml
      - tools/ab-auth/**
      - audits/ab-auth/**
      - audits/sql/**

permissions:
  contents: read

jobs:
  auth-matrix:
    if: github.ref == 'refs/heads/audit/store-isolation-candidate-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
      AB_PROJECT: neroxa-ab-${{ github.run_id }}
      AB_NETWORK: neroxa-ab-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Preflight and platform-only configuration
        run: |
          export AB_WORKDIR="$RUNNER_TEMP/neroxa-ab-$GITHUB_RUN_ID"
          echo "AB_WORKDIR=$AB_WORKDIR" >> "$GITHUB_ENV"
          test "$(df --output=avail -B1 "$RUNNER_TEMP" | tail -1)" -gt 8589934592
          mkdir -m 700 "$AB_WORKDIR"
          supabase init --workdir "$AB_WORKDIR"
          python3 tools/ab-auth/configure.py
          test ! -d "$AB_WORKDIR/supabase/migrations"
          test ! -f "$AB_WORKDIR/supabase/seed.sql"
          test ! -f "$AB_WORKDIR/supabase/.temp/project-ref"
          docker network create --driver bridge --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 "$AB_NETWORK" >/dev/null
      - name: Private Docker relay enforces loopback binds
        run: |
          python3 tools/ab-auth/docker_loopback.py > "$AB_WORKDIR/proxy.private.log" 2>&1 &
          echo "$!" > "$AB_WORKDIR/proxy.pid"
          for attempt in $(seq 1 30); do
            test -S "$AB_WORKDIR/docker-loopback.sock" && break
            sleep 1
          done
          test -S "$AB_WORKDIR/docker-loopback.sock"
          echo "DOCKER_HOST=unix://$AB_WORKDIR/docker-loopback.sock" >> "$GITHUB_ENV"
      - name: Start real local PostgreSQL Auth and REST
        run: |
          if ! supabase start --workdir "$AB_WORKDIR" --network-id "$AB_NETWORK" --exclude studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit > "$AB_WORKDIR/start.private.log" 2>&1; then
            python3 tools/ab-auth/start_failure.py
            exit 1
          fi
          supabase status --workdir "$AB_WORKDIR" -o env > "$AB_WORKDIR/status.private.env"
      - name: Rebuild historical catalog and run JWT matrix
        run: node tools/ab-auth/run.mjs
      - name: Checkout pinned Pizza Perfect Plate gateway source
        uses: actions/checkout@v4
        with:
          repository: luit77yak-dev/pizza-perfect-plate
          ref: 9538c47df38b0f9707c453f587a4d683a60791c0
          path: delivery-consumer
          persist-credentials: false
      - name: Verify pinned delivery commit
        run: test "$(git -C delivery-consumer rev-parse HEAD)" = "9538c47df38b0f9707c453f587a4d683a60791c0"
      - name: Integrate real local checkout gateway and test direct RPC revocation
        run: node --experimental-strip-types tools/ab-auth/checkout_gateway_integration.mjs
      - name: Exercise enabled TanStack HTTPS checkout on disposable Supabase
        run: node tools/ab-auth/checkout_http_enabled.mjs
      - name: Sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-auth-evidence-${{ github.run_id }}
          path: audits/ab-auth/results/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove only this disposable stack
        if: always()
        run: |
          if [ -f "$AB_WORKDIR/supabase/config.toml" ]; then
            supabase stop --workdir "$AB_WORKDIR" --no-backup
          fi
          docker network rm "$AB_NETWORK" 2>/dev/null || true
          if [ -f "$AB_WORKDIR/proxy.pid" ]; then kill "$(cat "$AB_WORKDIR/proxy.pid")" 2>/dev/null || true; fi
