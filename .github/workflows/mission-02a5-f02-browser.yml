name: F02 native TanStack Chromium disposable integration (NOT release)
on:
  push:
    branches: [security/mission-02a5-integration-local-20261014]
    paths:
      - .github/workflows/mission-02a5-f02-browser.yml
      - audits/02a5/f02-integration/**
permissions:
  contents: read
jobs:
  buyer-pre-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
      AB_PROJECT: neroxa-02a3-${{ github.run_id }}-buyer
      AB_NETWORK: neroxa-02a5-${{ github.run_id }}-buyer
      MISSION_PROFILE: master
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: luit77yak-dev/pizza-perfect-plate
          ref: 011275488660bfa1a9271b3e4c92e457f7638e34
          path: delivery-candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.0'
      - name: Public standard eligibility and real capacity before pull
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY --jq .private)" = false
          test "$RUNNER_ENVIRONMENT" = github-hosted
          echo 'PUBLIC_STANDARD_RUNNER=true; billing basis docs.github.com/en/billing/concepts/product-billing/github-actions; no larger runner/cache/artifact uploads'
          python3 tools/mission-02a3/preflight.py
      - name: Locked app dependencies and pinned CLI; no commercial dotenv
        run: |
          find . -name '.env*' -not -path './.git/*' -not -path './node_modules/*' -type f -delete
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/cli" --no-audit --no-fund supabase@2.120.0
          echo "$RUNNER_TEMP/cli/node_modules/.bin" >> "$GITHUB_PATH"
          python3 audits/02a5/verify_manifest.py
          python3 tools/mission-02a5/generate-buyer-run.py
          python3 audits/02a5/f02-amendment/generate.py
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.4'
      - name: Pinned browser and frozen candidate Delivery lockfile
        run: |
          set -euo pipefail
          test "$(git -C delivery-candidate rev-parse HEAD)" = 011275488660bfa1a9271b3e4c92e457f7638e34
          (cd delivery-candidate && bun install --frozen-lockfile --ignore-scripts)
          npm install --prefix "$RUNNER_TEMP/f02-playwright" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          echo "BROWSER_MODULE=$RUNNER_TEMP/f02-playwright/node_modules/playwright" >> "$GITHUB_ENV"
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo 'DELIVERY_BUN_FROZEN_AND_BROWSER_PINNED=PASS'
      - name: Unlinked native six-service stack, loopback binds
        run: |
          export AB_WORKDIR="$RUNNER_TEMP/02a5-buyer-$GITHUB_RUN_ID"
          echo "AB_WORKDIR=$AB_WORKDIR" >> "$GITHUB_ENV"
          mkdir -m 700 "$AB_WORKDIR"
          supabase init --workdir "$AB_WORKDIR"
          python3 tools/ab-auth/configure.py
          test ! -f "$AB_WORKDIR/supabase/.temp/project-ref"
          test ! -d "$AB_WORKDIR/supabase/migrations"
          docker network create --driver bridge --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 "$AB_NETWORK"
          python3 tools/ab-auth/docker_loopback.py > "$AB_WORKDIR/relay.private.log" 2>&1 &
          echo $! > "$AB_WORKDIR/relay.pid"
          for attempt in $(seq 1 30); do test -S "$AB_WORKDIR/docker-loopback.sock" && break; sleep 1; done
          export DOCKER_HOST="unix://$AB_WORKDIR/docker-loopback.sock"
          echo "DOCKER_HOST=$DOCKER_HOST" >> "$GITHUB_ENV"
          if ! supabase start --workdir "$AB_WORKDIR" --network-id "$AB_NETWORK" --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit > "$AB_WORKDIR/start.private.log" 2>&1; then
            python3 tools/ab-auth/start_failure.py
            exit 1
          fi
          supabase status --workdir "$AB_WORKDIR" -o env > "$AB_WORKDIR/status.private.env"
          chmod 600 "$AB_WORKDIR/status.private.env"
          python3 - <<'PY'
          import json,subprocess,os
          expected=json.load(open('audits/02a5/EXPECTED-IMAGES.json'));seen={}
          for line in subprocess.check_output(['docker','ps','--format','{{json .}}'],text=True).splitlines():
            c=json.loads(line)
            if c['Names'].endswith('_'+os.environ['AB_PROJECT']):seen[c['Image']]=subprocess.check_output(['docker','inspect',c['Names'],'--format','{{.Image}}'],text=True).strip()
          assert seen==expected, 'BLOCKED: image identity drift'
          print('IMAGE_IDENTITIES='+json.dumps(seen))
          PY
      - name: Real Auth and buyer recut with test UID egress restriction
        run: |
          set -euo pipefail
          sudo useradd --create-home --groups docker neroxa_test
          sudo chown -R neroxa_test:neroxa_test "$AB_WORKDIR"
          # Dedicated UID needs traversal/read of the audited workspace, not runner secrets.
          ancestor="$GITHUB_WORKSPACE"
          while [ "$ancestor" != / ]; do
            sudo setfacl -m u:neroxa_test:--x "$ancestor"
            ancestor=$(dirname "$ancestor")
          done
          sudo setfacl -R -m u:neroxa_test:rX "$GITHUB_WORKSPACE"
          sudo -u neroxa_test test -r tools/mission-02a3/buyer-generated.private.mjs
          echo 'TEST_UID_WORKSPACE_READ=PASS'
          bash tools/mission-02a5/network.sh lock
          trap 'bash tools/mission-02a5/network.sh unlock' EXIT
          sudo -u neroxa_test env -i PATH="$PATH" HOME=/home/neroxa_test AB_WORKDIR="$AB_WORKDIR" AB_PROJECT="$AB_PROJECT" MISSION_PROFILE=master MISSION_SOURCE_SHA="$GITHUB_SHA" MISSION_RUN_ID="$GITHUB_RUN_ID" MISSION_DELIVERY_SHA=011275488660bfa1a9271b3e4c92e457f7638e34 DOCKER_HOST=unix:///var/run/docker.sock node --experimental-strip-types tools/mission-02a3/buyer-generated.private.mjs | tee "$RUNNER_TEMP/f02-buyer-pre-gate.log"
      - name: Build real Delivery candidate against unlinked loopback-only Supabase
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # The isolated test UID owns the private status file. Give the build runner
          # temporary, narrow read permission; do not log secrets or loosen other files.
          runner_uid="$(id -u)"
          sudo setfacl -m "u:$runner_uid:--x" "$AB_WORKDIR"
          sudo setfacl -m "u:$runner_uid:r--" "$AB_WORKDIR/status.private.env"
          set -a
          source "$AB_WORKDIR/status.private.env"
          set +a
          sudo setfacl -x "u:$runner_uid" "$AB_WORKDIR/status.private.env"
          sudo setfacl -x "u:$runner_uid" "$AB_WORKDIR"
          test "$(python3 -c 'import os,urllib.parse; print(urllib.parse.urlparse(os.environ["API_URL"]).hostname)')" = 127.0.0.1
          export SUPABASE_URL="$API_URL" NEROXA_DELIVERY_BACKEND_URL="$API_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export VITE_NEROXA_BACKEND_MODE=homologation
          export VITE_NEROXA_TEST_BACKEND_URL="$API_URL"
          export VITE_NEROXA_TEST_PUBLISHABLE_KEY="$ANON_KEY"
          export VITE_NEROXA_TEST_PROJECT_REF=local-disposable
          export NEROXA_BACKEND_MODE=homologation NEROXA_TEST_PROJECT_REF=local-disposable
          export VITE_NEROXA_CHECKOUT_GATEWAY=true VITE_NEROXA_GROUP_ADDONS_V1=true
          export VITE_NEROXA_DURABLE_CHECKOUT_INTENTS=true
          export VITE_NEROXA_CHECKOUT_AMENDMENTS=true
          (cd delivery-candidate && node node_modules/vite/bin/vite.js build --mode homologation)
          test -f delivery-candidate/.output/server/index.mjs
          # Do not loosen directory ownership: create synthetic TLS materials as the
          # same dedicated unprivileged UID that owns the disposable AB_WORKDIR.
          sudo -u neroxa_test env AB_WORKDIR="$AB_WORKDIR" sh -c '
            openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
              -keyout "$AB_WORKDIR/f02-browser-key.private.pem" \
              -out "$AB_WORKDIR/f02-browser-cert.private.pem" \
              -subj "/CN=a.synthetic.invalid" \
              -addext "subjectAltName=DNS:a.synthetic.invalid,DNS:b.synthetic.invalid,DNS:c.synthetic.invalid" \
              > "$AB_WORKDIR/browser-openssl.private.log" 2>&1
          '
          sudo -u neroxa_test test -r "$AB_WORKDIR/f02-browser-key.private.pem"
          sudo sh -c "echo '127.0.0.1 a.synthetic.invalid b.synthetic.invalid c.synthetic.invalid' >> /etc/hosts"
          sudo setfacl -m u:neroxa_test:--x "$RUNNER_TEMP" "$RUNNER_TEMP/f02-playwright"
          sudo setfacl -R -m u:neroxa_test:rX "$RUNNER_TEMP/f02-playwright" "$GITHUB_WORKSPACE/delivery-candidate"
          echo 'CANDIDATE_COMPILED_LOCAL_LOOPBACK=PASS'
      - name: Real Chromium hydrates compiled TanStack on disposable native Supabase
        run: |
          set -euo pipefail
          bash tools/mission-02a5/network.sh lock
          trap 'bash tools/mission-02a5/network.sh unlock' EXIT
          sudo -u neroxa_test env -i PATH="$PATH" HOME=/home/neroxa_test AB_WORKDIR="$AB_WORKDIR" AB_PROJECT="$AB_PROJECT" \
            MISSION_SOURCE_SHA="$GITHUB_SHA" MISSION_DELIVERY_SHA=011275488660bfa1a9271b3e4c92e457f7638e34 \
            BROWSER_MODULE="$BROWSER_MODULE" CHROME_BIN="$CHROME_BIN" \
            DOCKER_HOST=unix:///var/run/docker.sock \
            node audits/02a5/f02-integration/native-browser.mjs \
            | tee "$RUNNER_TEMP/f02-chromium-pre-gate.log"
      - name: Read native PostgreSQL catalog (pre-gate ONLY)
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$AB_PROJECT" = "neroxa-02a3-$GITHUB_RUN_ID-buyer"
          db="supabase_db_$AB_PROJECT"
          docker ps --format '{{.Names}}' | grep -Fx "$db"
          docker exec -i "$db" psql -X -q -A -t -U postgres -d postgres -v ON_ERROR_STOP=1 < audits/02a5/f02-amendment/catalog.readonly.sql > "$RUNNER_TEMP/f02-catalog.jsonl"
          python3 - "$RUNNER_TEMP/f02-catalog.jsonl" <<'PY'
          import json,sys,os,pathlib
          content=[x.strip() for x in open(sys.argv[1]) if x.strip().startswith('{')]
          assert len(content)==1,'one catalog result expected'
          result=json.loads(content[0])
          pathlib.Path(os.environ['RUNNER_TEMP'],'f02-pg-catalog-verified.json').write_text(json.dumps(result))
          assert result['kind']=='F02_PRE_GATE_PG_CATALOG_ONLY'
          present=sorted({f['name'] for f in result['functions'] if f['name'] in ('get_public_order_status','append_public_order_items','append_public_order_items_with_payment')})
          missing=sorted(set(('get_public_order_status','append_public_order_items','append_public_order_items_with_payment'))-set(present))
          print('F02_CATALOG_LEGACY_COVERAGE='+json.dumps({'present':present,'missing':missing,'classification':'PARTIAL_IF_MISSING'}))
          assert 'get_public_order_status' in present,'historical P0 function unexpectedly absent'
          assert result['legacy_gate_applied'] is False
          print('F02_CATALOG_PRE_GATE='+json.dumps(result,sort_keys=True))
          print('F02_GATE=BLOCKED; POST_GATE=NOT_RUN; EXTERNAL_CONSUMERS=UNKNOWN')
          PY
      - name: Emit provisional SEC-01..18 with original security failures
        if: always()
        run: |
          python3 audits/02a5/f02-amendment/record-results.py "$RUNNER_TEMP/f02-buyer-pre-gate.log"
      - name: Cleanup only this disposable project
        if: always()
        run: |
          bash tools/mission-02a5/network.sh unlock
          if [ -n "${AB_WORKDIR:-}" ] && sudo test -d "$AB_WORKDIR"; then
            sudo chown -R "$(id -u):$(id -g)" "$AB_WORKDIR"
          fi
          export DOCKER_HOST=unix:///var/run/docker.sock
          if [ -n "${AB_WORKDIR:-}" ] && [ -f "$AB_WORKDIR/supabase/config.toml" ]; then
            supabase stop --workdir "$AB_WORKDIR" --no-backup
            if [ -f "$AB_WORKDIR/relay.pid" ]; then kill "$(cat "$AB_WORKDIR/relay.pid")" || true; fi
          fi
          docker --host=unix:///var/run/docker.sock network rm "$AB_NETWORK" || true
          remaining=$(docker --host=unix:///var/run/docker.sock ps -aq --filter label=com.supabase.cli.project=$AB_PROJECT)
          test -z "$remaining"
          echo 'CLEANUP=PASS; no project containers; no dumps or credentials uploaded'
